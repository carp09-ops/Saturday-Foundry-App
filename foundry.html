// Reused unchanged from main 9.10.16: national ledger and American tiebreaks.
function conferenceModel(data){
const rt={getState:()=>data};
  const norm=x=>String(x||'').trim();
  const canon=x=>norm(x).toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
  const getState=()=>rt.getState?.()||{};
  const dynastyTeams=()=>{const st=getState();return new Set((st.programs||[]).flatMap(p=>[String(p.team_id||''),canon(p.team_name)]).filter(Boolean));};
  const dynastyConfs=()=>{const st=getState();return new Set((st.programs||[]).map(p=>norm(p.conference||p.team_conference)).filter(Boolean));};

  // EA/real-world Sun Belt alignment used by this dynasty season. The conference
  // championship is East champion vs West champion, so Sun Belt cannot be ranked
  // as a single 14-team table for championship qualification.
  const SUN_BELT_DIVISIONS={
    East:new Set(['appalachian state','app state','coastal carolina','georgia southern','georgia state','james madison','marshall','old dominion']),
    West:new Set(['arkansas state','louisiana','louisiana lafayette','south alabama','southern mississippi','southern miss','texas state','troy','ul monroe','ulm','louisiana monroe'])
  };
  function isSunBelt(conf){const c=canon(conf);return c==='sun belt'||c==='sun belt conference';}
  function isAmerican(conf){return ['american','american conference','american athletic','american athletic conference'].includes(canon(conf));}
  function sunBeltDivision(name){const n=canon(name);for(const [division,names] of Object.entries(SUN_BELT_DIVISIONS)){if(names.has(n))return division;}return null;}

  function uniqueGames(){
    const st=getState(),m=new Map();
    // Conference Race needs the national schedule ledger, not only user-controlled
    // game entries. New dynasties can have complete CPU results in scheduleGames
    // while state.games contains only the Foundry coaches, which made CPU teams
    // incorrectly display 0-0 overall records.
    const source=(Array.isArray(st.scheduleGames)&&st.scheduleGames.length)?st.scheduleGames:(st.games||[]);
    for(const g of source){
      if(!g||g.is_bye)continue;
      const k=String(g.id||`${g.week_number}|${g.team_name}|${g.opponent_team}`);
      if(!m.has(k))m.set(k,g);
    }
    return [...m.values()];
  }
  function teamKey(id,name){return id?`id:${id}`:`name:${canon(name)}`;}
  function logo(id,name){
    const st=getState();
    const p=(st.programs||[]).find(x=>String(x.team_id||'')===String(id||'')||canon(x.team_name)===canon(name));
    return p?.logo_url||p?.team_logo_url||window.CDHQLogoResolver?.knownLogo?.(name)||'';
  }
  function build(){
    const st=getState(),teams=new Map(),games=uniqueGames(),dyn=dynastyTeams();
    const ensure=(id,name,conf)=>{
      const key=teamKey(id,name);
      if(!teams.has(key))teams.set(key,{key,id,name:norm(name)||'Unknown',conf:norm(conf),cw:0,cl:0,w:0,l:0,pf:0,pa:0,pdOverride:null,rem:0,headToHead:new Map(),dynasty:dyn.has(String(id||''))||dyn.has(canon(name))});
      const t=teams.get(key);if(!t.conf&&conf)t.conf=norm(conf);return t;
    };
    for(const g of games){
      const a=ensure(g.team_id,g.team_name,g.team_conference),b=ensure(g.opponent_team_id,g.opponent_team,g.opponent_conference);
      const type=String(g.game_type||'regular_season').toLowerCase();
      const confGame=['regular_season','conference'].includes(type)&&(!!g.is_conference_game||type==='conference'||(a.conf&&b.conf&&canon(a.conf)===canon(b.conf)));
      // Imported/sim rows are CPU context. If a dynasty-controlled program appears in one,
      // do not let that row create a second result on top of the coach's authoritative HQ game.
      // This keeps Conference Race aligned with the Overview standings ledger.
      const importedDynastyDuplicate=String(g.result_method||'').toLowerCase()==='sim'&&(a.dynasty||b.dynasty);
      if(g.status==='completed'&&g.points_for!=null&&g.points_against!=null&&!importedDynastyDuplicate){
        const pf=Number(g.points_for),pa=Number(g.points_against);
        if(Number.isFinite(pf)&&Number.isFinite(pa)&&pf!==pa){
          a.pf+=pf;a.pa+=pa;b.pf+=pa;b.pa+=pf;
          if(pf>pa){a.w++;b.l++;if(confGame){a.cw++;b.cl++;}}else{a.l++;b.w++;if(confGame){a.cl++;b.cw++;}}
          if(confGame){
            for(const [team,opponent,won] of [[a,b,pf>pa],[b,a,pa>pf]]){
              const record=team.headToHead.get(opponent.key)||{w:0,l:0};
              record[won?'w':'l']++;team.headToHead.set(opponent.key,record);
            }
          }
        }
      }else if(g.status==='scheduled'&&confGame){a.rem++;b.rem++;}
    }
    // For dynasty-controlled teams, the main Overview standings are the authoritative
    // overall record. Conference Race may enrich that record with CPU context, but it must
    // never disagree with the coach card on W-L or point differential.
    for(const t of teams.values()){
      if(!t.dynasty)continue;
      const auth=(st.standings||[]).find(r=>String(r.team_id||'')===String(t.id||'')||canon(r.team_name)===canon(t.name));
      if(auth){
        const w=Number(auth.wins),l=Number(auth.losses),pd=Number(auth.point_differential);
        if(Number.isFinite(w))t.w=w;
        if(Number.isFinite(l))t.l=l;
        if(Number.isFinite(pd))t.pdOverride=pd;
      }
    }
    return [...teams.values()].filter(t=>t.conf);
  }
  function sortRows(a,b){
    const ap=(a.cw+a.cl)?a.cw/(a.cw+a.cl):0,bp=(b.cw+b.cl)?b.cw/(b.cw+b.cl):0;
    return bp-ap||b.cw-a.cw||a.cl-b.cl||b.w-a.w||(b.pf-b.pa)-(a.pf-a.pa);
  }
  // American rules 10.3 and 10.5-10.6: percentage first, then head-to-head.
  // Resolve whole tied groups; a pairwise comparator can cycle in a three-way tie.
  // Missing CFP/computer inputs leave a tie unresolved, never skip to overall W-L.
  function americanRows(teams){
    const pct=t=>t.cw+t.cl?t.cw/(t.cw+t.cl):-1;
    const byName=(a,b)=>a.name.localeCompare(b.name)||a.key.localeCompare(b.key);
    function resolve(group){
      if(group.length<2)return [group];
      const records=group.map(team=>{
        const opponents=group.filter(other=>other!==team).map(other=>team.headToHead.get(other.key));
        return {team,complete:opponents.every(r=>r&&r.w+r.l>0),sweep:opponents.every(r=>r&&r.w>0&&r.l===0),w:opponents.reduce((n,r)=>n+(r?.w||0),0),l:opponents.reduce((n,r)=>n+(r?.l||0),0)};
      });
      let top=[];
      if(records.every(r=>r.complete)){
        const best=Math.max(...records.map(r=>r.w/(r.w+r.l)));
        top=records.filter(r=>r.w/(r.w+r.l)===best).map(r=>r.team);
      }else top=records.filter(r=>r.sweep).map(r=>r.team);
      if(!top.length||top.length===group.length)return [[...group].sort(byName)];
      return [...resolve(top),...resolve(group.filter(t=>!top.includes(t)))];
    }
    const groups=[];
    for(const team of [...teams].sort((a,b)=>pct(b)-pct(a)||byName(a,b))){
      const last=groups[groups.length-1];
      if(last&&pct(last[0])===pct(team))last.push(team);else groups.push([team]);
    }
    const rows=[];
    for(const group of groups.flatMap(resolve)){
      const rank=rows.length+1,played=pct(group[0])>=0;
      group.forEach(t=>rows.push({...t,raceRank:rank,raceTied:group.length>1,racePlayed:played,raceQualifier:played&&rank+group.length-1<=2}));
    }
    return rows;
  }

return {teams:build(), americanRows,isAmerican,isSunBelt,sunBeltDivision,sortRows};
}

function h2hMeetings(){
 const byId=new Map();
 (model.history||[]).filter(g=>g&&g.status==='completed'&&g.points_for!=null&&g.points_against!=null).forEach(g=>{
  if(!byId.has(g.id))byId.set(g.id,[]);
  byId.get(g.id).push(g);
 });
 const out=[];
 byId.forEach(rows=>{
  const byPerson=new Map();
  rows.forEach(r=>{if(r.person_id&&!byPerson.has(r.person_id))byPerson.set(r.person_id,r)});
  if(byPerson.size!==2)return;
  const [a,b]=[...byPerson.values()];
  out.push({a,b});
 });
 return out.sort((x,y)=>Number(x.a.season_number||0)-Number(y.a.season_number||0)||Number(x.a.week_number||0)-Number(y.a.week_number||0));
}
function seriesBoard(){
 const pairs=new Map();
 h2hMeetings().forEach(({a,b})=>{
  const key=[a.person_id,b.person_id].sort().join('|');
  if(!pairs.has(key))pairs.set(key,{p1:a.person_id,p2:b.person_id,names:{[a.person_id]:a.coach_name||recordCoachName(a.person_id),[b.person_id]:b.coach_name||recordCoachName(b.person_id)},wins:{},meetings:[]});
  const s=pairs.get(key);
  const winner=a.points_for>a.points_against?a.person_id:b.person_id;
  s.wins[winner]=(s.wins[winner]||0)+1;
  s.meetings.push({season:a.season_number,week:a.week_number,winner,line:`${a.team_name} ${a.points_for}–${a.points_against} ${b.team_name}`});
 });
 return [...pairs.values()].map(s=>{
  const last=s.meetings[s.meetings.length-1];
  let streakN=0;
  for(let i=s.meetings.length-1;i>=0;i--){if(s.meetings[i].winner===last.winner)streakN++;else break}
  return {...s,w1:s.wins[s.p1]||0,w2:s.wins[s.p2]||0,last,streakPid:last.winner,streakN};
 }).sort((x,y)=>(y.w1+y.w2)-(x.w1+x.w2));
}
function rivalryRows(){

  const opp=s.p1===selectedCoach?s.p2:s.p1,mine=s.p1===selectedCoach?s.w1:s.w2,theirs=s.p1===selectedCoach?s.w2:s.w1;
  const streak=s.streakN>1?(s.streakPid===selectedCoach?` · Won ${s.streakN} straight`:` · Lost ${s.streakN} straight`):'';
  return `<div class="series-row"><span>vs ${esc(s.names[opp])}<small class="series-detail">Last: ${esc(s.last.line)} · S${esc(s.last.season)} Wk ${esc(s.last.week)}${streak}</small></span><b>${mine}–${theirs}</b></div>`;
 });
}

function teamStreaks(){const byTeam=new Map();games().filter(g=>g.final).forEach(g=>{[[g.awayId,Number(g.a)>Number(g.h)],[g.homeId,Number(g.h)>Number(g.a)]].forEach(([id,won])=>{if(id==null)return;if(!byTeam.has(id))byTeam.set(id,[]);byTeam.get(id).push({wk:Number(g.week_number)||0,won})})});const out=new Map();byTeam.forEach((list,id)=>{list.sort((a,b)=>a.wk-b.wk);const last=list[list.length-1];if(!last)return;let n=0;for(let i=list.length-1;i>=0;i--){if(list[i].won===last.won)n++;else break}out.set(id,(last.won?'W':'L')+n)});return out}

function longestWinStreak(personId,games){

 mine.forEach(g=>{if(g.result==='W'){run++;best=Math.max(best,run)}else if(g.result==='L')run=0});

function bestSeason(personId,games){
 const completed=new Set(model.seasons.filter(s=>{const st=String(s?.status||'').toLowerCase();return !s?.is_active&&st!=='active'&&st!=='setup'&&Number(s?.season_number)!==Number(season?.season_number)}).map(s=>Number(s.season_number)));
 const by=new Map();
 games.filter(g=>g.person_id===personId&&completed.has(Number(g.season_number))).forEach(g=>{
  const n=Number(g.season_number||0);if(!by.has(n))by.set(n,{season:n,wins:0,losses:0,pf:0});
  const r=by.get(n);if(g.result==='W')r.wins++;if(g.result==='L')r.losses++;r.pf+=Number(g.points_for||0);
 });
 return [...by.values()].sort((a,b)=>{const ap=a.wins/Math.max(1,a.wins+a.losses),bp=b.wins/Math.max(1,b.wins+b.losses);return bp-ap||b.wins-a.wins||b.pf-a.pf})[0]||null;

function leagueExtremes(games){
 const mov=g=>Number(g.points_for)-Number(g.points_against);
 const pick=cmp=>games.reduce((b,g)=>!b||cmp(g,b)?g:b,null);
 return {
  blowout:pick((g,b)=>mov(g)>mov(b)),
  worstLoss:pick((g,b)=>mov(g)<mov(b)),
  shootout:pick((g,b)=>(Number(g.points_for)+Number(g.points_against))>(Number(b.points_for)+Number(b.points_against))),
  mostPoints:pick((g,b)=>Number(g.points_for)>Number(b.points_for)),
  nailbiter:pick((g,b)=>Math.abs(mov(g))<Math.abs(mov(b)))
 };
}

function intelTeamRecs(){
 const rec={};
 const credit=(name,w)=>{const k=String(name||'').toLowerCase();if(!k)return;if(!rec[k])rec[k]={w:0,l:0,t:0};rec[k][w]++};
 (model.history||[]).forEach(g=>{
  if(!g||g.status!=='completed'||g.is_bye)return;
  const pf=Number(g.points_for),pa=Number(g.points_against);
  if(!Number.isFinite(pf)||!Number.isFinite(pa))return;
  if(pf>pa){credit(g.team_name,'w');credit(g.opponent_team,'l')}
  else if(pa>pf){credit(g.opponent_team,'w');credit(g.team_name,'l')}
  else{credit(g.team_name,'t');credit(g.opponent_team,'t')}
 });

}
function coachPower(personId,games,recs){
 const mine=games.filter(g=>g.person_id===personId);
 let w=0,l=0,movSum=0,movN=0,sosSum=0,sosN=0;
 mine.forEach(g=>{
  if(g.result==='W')w++;else if(g.result==='L')l++;
  const m=Number(g.points_for)-Number(g.points_against);
  if(Number.isFinite(m)){movSum+=m;movN++}
  const r=recs[String(g.opponent_team||'').toLowerCase()],gp=r?r.w+r.l+r.t:0;
  if(r&&gp>0){sosSum+=(r.w+r.t*0.5)/gp;sosN++}
 });
 const n=w+l,pct=n?w/n:0,mov=movN?movSum/movN:0,sos=sosN?sosSum/sosN:0.5;
 const movScore=(Math.max(-30,Math.min(30,mov))+30)/60;
 return {w,l,n,pct,mov,sos,score:100*(0.50*pct+0.30*movScore+0.20*sos)};
}
function coachLuck(personId,games){
 let pf=0,pa=0,w=0,l=0;
 games.filter(g=>g.person_id===personId).forEach(g=>{
  const a=Number(g.points_for),b=Number(g.points_against);
  if(!Number.isFinite(a)||!Number.isFinite(b))return;
  pf+=a;pa+=b;
  if(g.result==='W')w++;else if(g.result==='L')l++;
 });
 const n=w+l,e=2.37;
 let expP=0.5;
 if(pf>0||pa>0){const pfe=Math.pow(pf,e),pae=Math.pow(pa,e);expP=(pfe+pae)>0?pfe/(pfe+pae):0.5}
 const expW=expP*n;
 return {w,l,n,expW,expL:n-expW,luck:w-expW,pf,pa};
}

async function submitLeague(form){const name=form.elements.leagueName.value.trim();if(!name)return setFormMessage('Enter a league name.');await writeAction('create_dynasty',{p_name:name,p_short_name:form.elements.shortName.value.trim()||null,p_game_edition:form.elements.edition.value,p_year:null},form,async result=>{model.dynasties=await read('v_my_dynasties','order=joined_at.asc');const id=Array.isArray(result)?result[0]?.dynasty_id:result?.dynasty_id;notice='Your league is ready. Choose a program to get started.';if(id){await loadDynasty(id);await openTeamSelection()}else{route='leagues';render()}})}
async function openTeamSelection(){if(!activeSeason()||mutationPending)return;const key=context();route='selectteam';teamChoices=[];entryError='';render();try{const choices=await readRpc('get_team_selection',{p_season_id:season.season_id});if(key!==context())return;teamChoices=Array.isArray(choices)?choices:[];render()}catch(e){if(key===context()){entryError=e.message;render()}}}
function selectionPage(){const mine=ownProgram();if(mine)return title(dynasty.name,'Your program is set.',mine.team_name)+`<button class="primary" onclick="openTeam('${uid(mine.team_id)}')">View your team</button>`;const confs=[...new Set(teamChoices.map(t=>t.conference||'Independent'))].sort();const list=teamChoices.filter(t=>(!choiceAvailable||!t.claimed)&&(!choiceConference||(t.conference||'Independent')===choiceConference)&&(!choiceQuery||(t.team_name+' '+t.conference).toLowerCase().includes(choiceQuery.toLowerCase())));return title(dynasty.name,'Choose your program.','Season '+season.season_number+' · The next chapter starts here.')+`<div class="selection-filters"><div class="searchbox">${ico('search')}<input aria-label="Search programs" placeholder="Search schools" value="${esc(choiceQuery)}" oninput="filterProgramChoices(this.value)"></div><label class="sr-only" for="choiceConference">Conference</label><select id="choiceConference" onchange="choiceConference=this.value;render()"><option value="">All conferences</option>${confs.map(c=>`<option ${choiceConference===c?'selected':''}>${esc(c)}</option>`).join('')}</select><label class="checkline"><input type="checkbox" ${choiceAvailable?'checked':''} onchange="choiceAvailable=this.checked;render()"> Available only</label></div><p class="sport-note">${teamChoices.filter(t=>!t.claimed).length} available · ${teamChoices.filter(t=>t.claimed).length} claimed</p>${entryError?`<p class="error-message">${esc(entryError)}</p><button class="secondary" onclick="openTeamSelection()">Retry</button>`:''}<div id="programChoices" class="program-grid">${choiceCards(list)}</div>${!teamChoices.length&&!entryError?empty('Loading available programs…'):''}<button class="link" onclick="go('home')">Explore the league first →</button>`}
function choiceCards(list){return list.map(t=>`<button class="program-choice" ${t.claimed?'disabled':''} onclick="chooseProgram('${uid(t.team_id)}')"><span class="choice-status">${t.claimed?'CLAIMED':'AVAILABLE'}</span>${logo(t.team_id,t.team_name)}<strong>${esc(t.team_name)}</strong><small>${esc(t.conference||'Independent')}</small><span class="rating-strip"><span>OVR <b>${esc(t.overall_rating??'—')}</b></span><span>OFF <b>${esc(t.offense_rating??'—')}</b></span><span>DEF <b>${esc(t.defense_rating??'—')}</b></span></span>${t.claimed?`<small>${esc(t.claimed_by||'Assigned coach')}</small>`:''}</button>`).join('')||empty('No programs match your search.')}
function filterProgramChoices(q){choiceQuery=q;const list=teamChoices.filter(t=>(!choiceAvailable||!t.claimed)&&(!choiceConference||(t.conference||'Independent')===choiceConference)&&(!q||(t.team_name+' '+t.conference).toLowerCase().includes(q.toLowerCase())));$('programChoices').innerHTML=choiceCards(list)}
function chooseProgram(id){const t=teamChoices.find(t=>t.team_id===id);if(!t||t.claimed||!actionsEnabled()||ownProgram())return;teamChoice={...t,seasonId:season.season_id,dynastyId:dynasty.dynasty_id};go('claimreview')}
function claimReview(){if(!teamChoice||teamChoice.seasonId!==season?.season_id)return empty('Choose an available program first.');const t=teamChoice;return title('Your next chapter','Make it yours.')+`<div class="claim-hero">${logo(t.team_id,t.team_name)}<h2>${esc(t.team_name)}</h2><p>${esc(t.conference)} · Season ${esc(season.season_number)}</p></div><p class="article-inline">You’ll become this program’s coach in ${esc(dynasty.name)}. Your completed seasons and career history stay with you.</p><form class="compact-form" onsubmit="event.preventDefault();claimProgram(this)">${formStatus()}<button type="submit" class="primary">Confirm ${esc(t.team_name)}</button><button type="button" class="secondary" onclick="go('selectteam')">Choose another team</button></form>`}
async function claimProgram(form){const t=teamChoice;if(!t||t.seasonId!==season?.season_id||t.dynastyId!==dynasty?.dynasty_id||!activeSeason())return setFormMessage('The season changed. Choose your team again.');await writeAction('claim_team',{p_season_id:t.seasonId,p_team_id:t.team_id},form,async()=>{notice='You’re the coach. Welcome to '+t.team_name+'.';await refreshCurrent('home')})}
function beginResult(id){const g=games().find(g=>g.id===id);if(!scoreEntryAllowed(g))return;resultDraft={gameId:id,context:context(),seasonId:season.season_id,myTeamId:ownProgram().team_id,away:'',home:'',overtime:false};selectedGame=id;go('result')}

function reviewResult(form){const a=form.elements.awayScore.value,h=form.elements.homeScore.value;if(a===''||h===''||![a,h].every(v=>Number.isInteger(Number(v))&&Number(v)>=0&&Number(v)<=250)||Number(a)===Number(h))return setFormMessage('Enter two valid, non-tied final scores.');resultDraft={...resultDraft,away:Number(a),home:Number(h),overtime:form.elements.overtime.checked};go('resultreview')}
function resultReview(){const g=games().find(g=>g.id===resultDraft?.gameId);if(!g||resultDraft.context!==context())return empty('The game context changed. Open the game again.');const d=resultDraft;return title('Ready to record','Confirm the final.')+card({...g,a:d.away,h:d.home,final:true,overtime:d.overtime})+`<p class="article-inline">${d.correction?'Commissioner correction — this updates the official league record.':isH2H(g)?'The other coach will be able to confirm this result.':'This result will update your league records and standings.'}</p><form class="compact-form" onsubmit="event.preventDefault();saveResult(this)">${formStatus()}<button class="primary" type="submit">Save final score</button><button class="secondary" type="button" onclick="go('result')">Edit score</button></form>`}
async function saveResult(form){const d=resultDraft,g=games().find(g=>g.id===d?.gameId);if(!d||d.context!==context()||(d.correction?!(canManage()&&activeSeason()&&g):!scoreEntryAllowed(g)))return setFormMessage('This game can no longer be entered here. Refresh its status.');const mine=d.myTeamId===g.awayId,entryMine=g.team_id===d.myTeamId;const payload={p_game_id:g.id,p_my_score:mine?d.away:d.home,p_opponent_score:mine?d.home:d.away,p_my_rank:entryMine?g.team_rank:g.opponent_rank,p_opponent_rank:entryMine?g.opponent_rank:g.team_rank,p_overtime:d.overtime,p_network:g.network||null,p_event_name:g.event_name||null};await writeAction('submit_game_result',payload,form,async()=>{notice=d.correction?'Final score corrected.':'Final score saved.';resultDraft=null;await refreshCurrent('game',g.id)})}
function h2hStatus(g){if(!isH2H(g)||!g.final)return '';const v=h2hMeta.results?.find(v=>v.game_id===g.id);let label=!h2hMeta.ready?'Validation status is unavailable.':!v?'Historical final · No validation record.':v.status==='confirmed'?'Confirmed by both coaches':v.status==='resolved'?'Resolved by commissioner':v.status==='disputed'?'Flagged for commissioner review':'Awaiting '+(v.opponent_name||'the other coach')+'’s confirmation';const can=v?.status==='pending'&&v.opponent_person===myCoach()&&v.submitted_by!==myCoach();return `<div class="notice"><strong>Coach vs coach</strong><p>${esc(label)}</p>${can?`<button class="secondary" onclick="validateDialog('${uid(g.id)}')">Validate final</button>`:''}${v?.status==='disputed'&&canManage()?'<button class="secondary" onclick="go(\'office\')">Review dispute</button>':''}</div>`}
function validateDialog(id){const g=games().find(g=>g.id===id),v=h2hMeta.results?.find(x=>x.game_id===id);if(!g||!v||v.opponent_person!==myCoach()||v.status!=='pending')return;openSheet('Validate final',title('Entered by '+v.submitted_name,g.away+' at '+g.home)+card(g)+`<form id="validationForm"><label for="validationNote">If incorrect, describe the issue</label><textarea id="validationNote" name="note" maxlength="500"></textarea>${formStatus()}<button type="button" class="primary" onclick="validateFinal('${uid(id)}',true,this.form)">Confirm final</button><button type="button" class="secondary" onclick="validateFinal('${uid(id)}',false,this.form)">Flag incorrect score</button></form>`)}

async function openAddGame(){if(!actionsEnabled()||!ownProgram())return;const key=context();gameOptions=[];entryError='';go('addgame');try{const rows=await readRpc('get_schedule_team_options',{p_season_id:season.season_id});if(key!==context())return;gameOptions=Array.isArray(rows)?rows:[];if(route==='addgame'){const select=$('opponent');if(select){const selected=select.value;select.innerHTML=opponentOptions();select.value=selected}else render()}}catch(e){if(key===context()){entryError=e.message;if(route==='addgame')setFormMessage(entryError)}}}

function bracketData(){
 const isCfp=g=>{const t=String(g.game_type||'').toLowerCase();return t==='playoff'||t==='cfp'};
 const post=games().filter(g=>!g.is_bye&&(isCfp(g)||String(g.game_type||'').toLowerCase()==='national_championship'));
 const byeTeams=model.scheduleGames.filter(g=>{if(!g?.is_bye)return false;const en=String(g?.event_name||''),gt=String(g?.game_type||'').toLowerCase(),wk=Number(g?.week_number||0);return /CFP|playoff|first round bye/i.test(en)||/cfp|playoff/.test(gt)||wk>=16});
 if(!post.length&&!byeTeams.length)return null;
 const natty=post.filter(g=>String(g.game_type||'').toLowerCase()==='national_championship');
 const cfpGames=post.filter(isCfp);
 const weeks=[...new Set(cfpGames.map(g=>Number(g.week_number||0)).filter(w=>w>0&&w<900))].sort((a,b)=>a-b);
 const sizes=[4,4,2,1];
 const tbd=(r,i)=>({id:`cfp-tbd-r${r}-${i}`,synthetic:true,away:'TBD',home:'TBD',awayId:null,homeId:null,final:false});
 const shortName=n=>{n=String(n||'').trim();return n&&n.toUpperCase()!=='TBD'?n:''};
 const winnerOf=(g1,g2)=>{const m1=[shortName(g1?.away),shortName(g1?.home)].filter(Boolean).join('/'),m2=[shortName(g2?.away),shortName(g2?.home)].filter(Boolean).join('/');if(m1&&m2)return[`Winner of ${m1}`,`Winner of ${m2}`];if(m1)return[`Winner of ${m1}`,'TBD'];if(m2)return['TBD',`Winner of ${m2}`];return['TBD','TBD']};
 const rounds=[];
 for(let r=0;r<4;r++){
  let roundGames=[];
  if(r===3&&natty.length)roundGames=natty.slice(0,1);
  else if(r<weeks.length)roundGames=cfpGames.filter(g=>Number(g.week_number||0)===weeks[r]);
  if(r===1&&byeTeams.length){
   const slots=sizes[r]-roundGames.length,r1=rounds[0]||[];
   for(let i=0;i<Math.min(byeTeams.length,slots);i++){
    const bt=byeTeams[i];let opp='TBD';const r1g=r1[i];
    if(r1g){const m=[shortName(r1g.away),shortName(r1g.home)].filter(Boolean).join('/');if(m)opp='Winner of '+m}
    roundGames.push({id:'cfp-bye-'+(bt.id||i),synthetic:true,away:opp,home:bt.team_name||'TBD',awayId:null,homeId:bt.team_id||null,final:false,event_name:'CFP Quarterfinal — First Round Bye'});
   }
  }
  if(r===1&&rounds.length){
   const prev=rounds[0]||[];
   for(let i=roundGames.length;i<sizes[r];i++){
    const[w1,w2]=winnerOf(prev[(i*2)%prev.length],prev[(i*2+1)%prev.length]);
    roundGames.push({id:`cfp-tbd-r${r}-${i}`,synthetic:true,away:w2,home:w1,awayId:null,homeId:null,final:false});
   }
  }else{
   while(roundGames.length<sizes[r])roundGames.push(tbd(r,roundGames.length));
  }

 }

 let best=0;for(let i=0;i<roundWeeks.length;i++)if(roundWeeks[i]&&Number(week)>=roundWeeks[i])best=i;
 const hasContent=rs=>rs.some(g=>{const a=String(g.away||'').toUpperCase(),h=String(g.home||'').toUpperCase();return (a&&a!=='TBD'&&!a.startsWith('WINNER OF'))||(h&&h!=='TBD'&&!h.startsWith('WINNER OF'))});
 if(!hasContent(data.rounds[best]))for(let i=data.rounds.length-1;i>best;i--)if(hasContent(data.rounds[i])){best=i;break}

/* Bottom Line ticker: league-wide scores, headlines, coach carousel and
   standings snapshots for the standalone ribbon. Every section is guarded:
   a ticker failure must never break rendering, so any error falls back to
   the static brand line. */
function upsetLine(g){
 const rankOf=id=>{const r=id===g.team_id?g.team_rank:id===g.opponent_team_id?g.opponent_rank:null;const n=Number(r);return Number.isFinite(n)&&n>=1&&n<=25?n:null};
 const awayWon=Number(g.a)>Number(g.h);
 const winner=awayWon?g.away:g.home,loser=awayWon?g.home:g.away;
 const wScore=awayWon?g.a:g.h,lScore=awayWon?g.h:g.a;
 const lr=rankOf(awayWon?g.homeId:g.awayId),wr=rankOf(awayWon?g.awayId:g.homeId);
 if(lr==null||(wr!=null&&wr<lr))return null;
 return `${winner} ${wScore}, #${lr} ${loser} ${lScore}`;
}
function tickerItems(){
 const items=[];
 try{ /* Latest finals across the whole league, user and CPU teams alike. */
  const gs=(typeof games==='function'?games():[])||[];
  const finals=gs.filter(g=>g&&!g.is_bye&&g.final&&Number.isFinite(Number(g.a))&&Number.isFinite(Number(g.h)));
  if(finals.length){
   const wk=Math.max(...finals.map(g=>Number(g.week_number)||0));
   const users=new Set((model.programs||[]).filter(p=>p.person_id).map(p=>String(p.team_id)));
   const heat=g=>((users.has(String(g.awayId))||users.has(String(g.homeId)))?2:0)+(['national_championship','conference_championship','playoff','cfp'].includes(g.game_type)?1:0);
   const rows=finals.filter(g=>Number(g.week_number)===wk).sort((x,y)=>heat(y)-heat(x));
   const upsets=[],plain=[];for(const g of rows){const u=upsetLine(g);if(u)upsets.push({k:'Upset alert',t:u});else plain.push(g)}for(const u of upsets)items.push(u);for(const g of plain.slice(0,Math.max(0,10-upsets.length)))items.push({k:'Final',t:`${g.away} ${g.a}, ${g.home} ${g.h}${g.overtime?' · OT':''}`});
  }
 }catch(e){}
 try{ /* Saturday Report headlines and next matchups. */
  const r=reportSelection();
  for(const s of (r.available||[]).filter(s=>s.type!=='preview').slice(0,5))items.push({k:s.kicker,t:s.headline});
  for(const s of (r.next||[]).slice(0,2)){const g=s.game;if(g)items.push({k:'Next up',t:`${g.away} at ${g.home} · Week ${g.week_number}`})}
 }catch(e){}
 try{ /* Coach carousel: a current assignment that follows a different program. */
  const byCoach=new Map();
  for(const s of (model.stops||[])){if(!s||!s.person_id)continue;if(!byCoach.has(s.person_id))byCoach.set(s.person_id,[]);byCoach.get(s.person_id).push(s)}
  const names=new Map((model.programs||[]).filter(p=>p.person_id).map(p=>[String(p.person_id),p.coach_name]));
  for(const [pid,stops] of byCoach){
   const sorted=[...stops].sort((a,b)=>Number(b.season_number)-Number(a.season_number));
   const cur=sorted.find(s=>s.current_assignment)||sorted[0];
   if(!cur||!names.get(String(pid)))continue;
   const prev=sorted.find(s=>String(s.team_id)!==String(cur.team_id));
   if(prev&&Number(cur.season_number)>Number(prev.season_number))items.push({k:'Coach carousel',t:`${names.get(String(pid))} takes over at ${cur.team_name}`});
  }
 }catch(e){}
 try{ /* Conference leaders snapshot. */
  const cm=conferenceModel(model),byConf=new Map();
  for(const t of (cm.teams||[])){if(!t||!t.conf)continue;if(!byConf.has(t.conf))byConf.set(t.conf,[]);byConf.get(t.conf).push(t)}
  for(const conf of [...byConf.keys()].sort()){
   const lead=[...byConf.get(conf)].sort(cm.sortRows||((a,b)=>b.w-a.w||b.cw-a.cw))[0];
   if(lead&&(lead.w>0||lead.l>0))items.push({k:conf,t:`${lead.name} ${lead.w}–${lead.l} leads the way`});
  }
 }catch(e){}
 return items.slice(0,22);
}
const sfTicker={items:[],idx:0,timer:null,swap:null};
function tickerCardHTML(it){return `<b>${esc(it.k)}</b><span class="sf-tk-view"><span class="sf-tk-inner">${esc(it.t)}</span></span>`}
function tickerFit(){
 const card=document.querySelector('.sf-bottom-ribbon .sf-ticker-card');
 if(!card)return;
 const view=card.querySelector('.sf-tk-view'),inner=card.querySelector('.sf-tk-inner');
 if(!view||!inner)return;
 card.classList.remove('sf-tick-scroll');
 card.style.removeProperty('--sf-tick-shift');
 card.style.removeProperty('--sf-tick-dur');
 let size=10;card.style.fontSize=size+'px';
 while(inner.scrollWidth>view.clientWidth&&size>8){size-=0.5;card.style.fontSize=size+'px'}
 if(inner.scrollWidth<=view.clientWidth)return;
 if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 card.style.fontSize='9px';
 card.classList.add('sf-tick-scroll');
 const shift=inner.scrollWidth-view.clientWidth+6;
 if(shift<=0){card.classList.remove('sf-tick-scroll');return}
 card.style.setProperty('--sf-tick-shift',shift+'px');
 card.style.setProperty('--sf-tick-dur',Math.min(4.4,Math.max(2.2,shift/75)).toFixed(2)+'s');
}
function tickerStep(){
 const card=document.querySelector('.sf-bottom-ribbon .sf-ticker-card');
 if(!card||sfTicker.items.length<2||document.hidden)return;
 sfTicker.idx=(sfTicker.idx+1)%sfTicker.items.length;
 const next=sfTicker.items[sfTicker.idx];
 if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){card.innerHTML=tickerCardHTML(next);tickerFit();return}
 card.classList.add('sf-tick-out');
 clearTimeout(sfTicker.swap);
 sfTicker.swap=setTimeout(()=>{const c=document.querySelector('.sf-bottom-ribbon .sf-ticker-card');if(c){c.innerHTML=tickerCardHTML(next);c.classList.remove('sf-tick-out');tickerFit()}},290);
}
function tickerInner(){
 const tag='Your dynasty, forged on Saturdays';
 let items=[];
 try{items=tickerItems()}catch(e){items=[]}
 if(!items.length)return `<span class="sf-bottom-ribbon-mark" aria-hidden="true">SF</span><span class="sf-bottom-ribbon-text">${tag}</span>`;
 items.push({k:'Saturday Foundry',t:tag});
 sfTicker.items=items;
 if(sfTicker.idx>=items.length)sfTicker.idx=0;
 clearInterval(sfTicker.timer);
 sfTicker.timer=items.length>1?setInterval(tickerStep,5000):null;
 setTimeout(()=>{try{tickerFit()}catch(e){}},60);
 return `<span class="sf-ticker-brand" aria-hidden="true"><img class="sf-ticker-logo" src="${BRAND_ASSET}foundry-shield.webp" alt=""><span class="sf-ticker-brand-text">The Line</span></span><span class="sf-ticker-stage" aria-hidden="true"><span class="sf-ticker-card">${tickerCardHTML(items[sfTicker.idx])}</span></span>`;
}

function careerRecord(r={}){return `${num(r.wins)}–${num(r.losses)}${num(r.ties)?'–'+num(r.ties):''}`}

function careerCategory(r){const key=String(r.type||'')+' '+String(r.name||'');return /national.*champ/i.test(key)?'national':/conference/i.test(key)?'conference':/bowl/i.test(key)?'bowl':'award'}

function careerTeamRecords(rows){
 const teams=new Map(),seen=new Set();
 for(const r of rows){const key=r.team_id||r.team_name,stop=JSON.stringify([r.dynasty_id,r.season_id??r.edition_season_number??r.year,key,r.game_edition_year]);if(seen.has(stop))continue;seen.add(stop);
  if(!teams.has(key))teams.set(key,{...r,wins:0,losses:0,ties:0,editions:new Set(),seasons:new Set()});
  const t=teams.get(key);t.wins+=num(r.wins);t.losses+=num(r.losses);t.ties+=num(r.ties);if(careerEdition(r.game_edition_year))t.editions.add(careerEdition(r.game_edition_year));t.seasons.add(JSON.stringify([r.dynasty_id,r.season_id??r.edition_season_number??r.year]));
 }
 return [...teams.values()].sort((a,b)=>(b.wins+b.losses+b.ties)-(a.wins+a.losses+a.ties)||String(a.team_name).localeCompare(String(b.team_name)));

function careerJourneyGroups(rows){
 const groups=new Map();for(const r of rows){const key=JSON.stringify([careerEdition(r.game_edition_year),r.dynasty_id||r.dynasty_name]);if(!groups.has(key))groups.set(key,{key,edition:careerEdition(r.game_edition_year),name:careerLeagueName(r),rows:[]});groups.get(key).rows.push(r)}

}

 return `<article class="career-chapter"><header><div><span class="eyebrow">${esc(careerEditionLabel(g.edition))}</span><h3>${esc(g.name)}</h3></div>${chapter?`<div class="chapter-record"><strong>${careerRecord(chapter)}</strong><small>${chapter.retired?'Retired':chapter.status==='archived'?'Archived league':'Recorded record'}</small></div>`:''}</header><ol class="career-journey">${g.rows.map((r,i)=>{const prev=g.rows[i-1],moved=prev&&(r.team_id||r.team_name)!==(prev.team_id||prev.team_name)&&num(r.edition_season_number??r.year)>num(prev.edition_season_number??prev.year);return `<li>${careerTeamLogo(r)}<div><small>${esc(careerSeasonLabel(r))}</small><strong>${esc(r.team_name||'Team not recorded')}</strong>${moved?'<span class="career-move">New program</span>':''}${r.retired_from_program?'<small>Retired from program</small>':''}</div><b>${careerRecord(r)}</b></li>`}).join('')}</ol></article>`;
 }).join('')||empty('Your coaching journey will appear as program assignments are recorded.')}

function careerHonorArt(r){const category=careerCategory(r),key=careerHonorName(r).toLowerCase().replace(/[’']/g,''),award=CAREER_AWARD_ART.find(([name])=>key.includes(name));return category==='national'?'assets/cfp-trophy-transparent.png':category==='award'&&award?'assets/trophy-vault/awards/'+award[1]+'.webp':'assets/trophy-vault/'+category+'.webp'}

function setCareerArchive(enabled){Object.assign(careerFilters,{edition:'all',dynasty:'all',type:'all',archive:!!enabled});refreshCareerHonors()}
function refreshCareerHonors(){const hub=careerData(),host=$('careerHonors');if(hub&&host){const focus=document.activeElement?.id;host.innerHTML=careerHonorsMarkup(hub);if(focus&&$(focus))$(focus).focus()}}
function showCareerHonor(index){const hub=careerData(),r=hub?.honors[index];if(!r)return;const score=r.points_for!=null&&r.points_against!=null?`${r.points_for}–${r.points_against}`:'—';openSheet('Career honor',title(careerEditionLabel(r.game_edition_year),careerHonorName(r),careerLeagueName(r))+`<img class="career-honor-hero" src="${careerHonorArt(r)}" alt="" onerror="careerTrophyFallback(this)">`+table(['Detail','Recorded value'],[['Coach',esc(hub.coach.name)],['Team',esc(r.team_name||r.metadata?.team||'—')],['Recipient',esc(careerHonorRecipient(r)||'—')],['Season',esc(careerSeasonLabel(r))],['Opponent',esc(r.opponent_team||'—')],['Score',esc(score)]]))}
function careerFactsMarkup(hub,kind){const rows=hub.facts.filter(r=>r.kind===kind);return rows.length?`<ul class="career-facts">${rows.map(r=>`<li><div><strong>${esc(r.recipient_name||r.label||'Recorded achievement')}</strong><span>${esc(r.label||'')}${r.value!=null?' · '+(kind==='draft_pick'?'Round ':'')+esc(r.value):''}${kind==='draft_pick'&&r.metadata?.pick!=null?' · Pick '+esc(r.metadata.pick):''}</span><small>${esc(careerMeta(r))}</small></div></li>`).join('')}</ul>`:empty(kind==='draft_pick'?'No draft picks have been recorded.':'No statistical leaders have been recorded.')}
function careerHubMarkup(){
 const hub=careerData();if(!hub)return `<div class="career-loading" role="status">${personalCareer.error?`<h2>Your career could not load.</h2><p>${esc(personalCareer.error)}</p><button class="secondary" onclick="loadMyCareer(true)">Retry career</button>`:'Loading your complete coaching career…'}</div>`;
 if(!hub.coach)return empty('Your career starts here. Claim your coach in a league to begin recording your history.')+button('Choose a league','leagues','secondary');
 const t=hub.totals||{},gp=num(t.wins)+num(t.losses)+num(t.ties),teams=careerTeamRecords(hub.timeline),name=hub.coach.name||'Coach',portrait=artwork(name)||validArtworkUrl(hub.coach.avatar_url)||THEME_ART+'coach-headset.webp';
 return `<div class="career-refresh"><span role="status">${personalCareer.error?'Refresh unavailable · showing last loaded history':'Live career data · refreshes automatically'}</span><button onclick="loadMyCareer(true)" ${personalCareerRequest?'disabled':''}>${personalCareerRequest?'Refreshing…':'Refresh'}</button></div><header class="career-identity"><div><span class="eyebrow">EVERY LEAGUE. EVERY EDITION.</span><h2>Coach ${esc(name)}</h2><strong class="career-total">${careerRecord(t)}</strong><span class="career-record-label">Career record</span></div><button class="career-card-button" onclick="showMyCareerCard()" aria-label="Open ${esc(name)} coach card"><img src="${esc(portrait)}" alt="${esc(name)} coach card" onerror="imageFallback(this,'coach')"></button></header><div class="career-titles">${[[t.national_titles,'National titles'],[t.conference_titles,'Conference titles'],[t.heismans,'Heismans']].map(([n,k])=>`<div><strong>${num(n)}</strong><span>${k}</span></div>`).join('')}</div><nav class="career-jumps" aria-label="Career sections">${[['careerEditions','Editions'],['careerTeams','Teams'],['careerJourney','Journey'],['careerHonors','Honors'],['careerDraft','Draft'],['careerStats','Stats']].map(([id,n])=>`<button onclick="jump('${id}')">${n}</button>`).join('')}</nav>
 <section id="careerEditions" class="career-section"><h2>Edition over edition</h2><div class="career-editions">${hub.editions.map(e=>`<article><span class="eyebrow">College Football ${esc(careerEdition(e.game_edition_year)||'—')}</span><strong>${careerRecord(e)}</strong><p>${num(e.national_titles)} national · ${num(e.conference_titles)} conference · ${num(e.heismans)} Heismans</p></article>`).join('')||empty('No game editions have been recorded yet.')}</div></section>
 <section id="careerTeams" class="career-section"><h2>Teams coached <span class="career-count">${teams.length}</span></h2><ul class="career-team-list">${teams.map(r=>`<li>${careerTeamLogo(r)}<div><strong>${esc(r.team_name||'Team not recorded')}</strong><small>${r.seasons.size} ${r.seasons.size===1?'season':'seasons'} · ${[...r.editions].sort((a,b)=>b-a).map(e=>'CFB '+e).join(' / ')||'Edition not recorded'}</small></div><b>${careerRecord(r)}</b></li>`).join('')||'<li>No programs recorded yet.</li>'}</ul></section>
 <section id="careerJourney" class="career-section"><h2>Coaching journey</h2><p class="sport-note">Each league keeps its own timeline. Your history stays with you when you change programs.</p>${careerJourneyMarkup(hub)}</section>
 <section id="careerHonors" class="career-section">${careerHonorsMarkup(hub)}</section>
 <section id="careerDraft" class="career-section"><h2>Draft history <span class="career-count">${hub.facts.filter(r=>r.kind==='draft_pick').length}</span></h2>${careerFactsMarkup(hub,'draft_pick')}</section>
 <section id="careerStats" class="career-section"><h2>Career statistics</h2><div class="career-stats">${[[gp?((num(t.wins)+num(t.ties)/2)/gp*100).toFixed(1)+'%':'—','Win percentage'],[num(t.draft_picks),'Draft picks'],[num(t.awards),'Player / coach awards'],[num(t.seasons),'Seasons'],[num(t.bowl_wins)+'–'+num(t.bowl_losses),'Bowl record'],[num(t.playoff_wins)+'–'+num(t.playoff_losses),'Playoff record'],[num(t.scored_games)?(num(t.points_for)/num(t.scored_games)).toFixed(1):'—','Points per game'],[num(t.scored_games)?(num(t.points_against)/num(t.scored_games)).toFixed(1):'—','Points allowed']].map(([v,k])=>`<div><strong>${esc(v)}</strong><span>${k}</span></div>`).join('')}</div><p class="sport-note">Totals include verified, completed user games, including seasons in progress. Scoring averages omit games with missing scores. Awards reflect recorded honors.</p><h3>Statistical leaders</h3>${careerFactsMarkup(hub,'stat_leader')}</section>`;
}
function showMyCareerCard(){const c=careerData()?.coach;if(!c)return;const src=artwork(c.name)||validArtworkUrl(c.avatar_url)||THEME_ART+'coach-headset.webp';openSheet(c.name+' · Coach card',`<img class="portrait" src="${esc(src)}" alt="${esc(c.name)} coach card" onerror="imageFallback(this,'coach')">`)}
function refreshCareerMarkup(){const host=$('careerHubRoot');if(route!=='mycareer'||!host||busy||mutationPending||$('detailSheet')?.open)return;const top=$('screenViewport')?.scrollTop,focus=document.activeElement?.id;host.innerHTML=careerHubMarkup();if($('screenViewport'))$('screenViewport').scrollTop=top||0;if(focus&&$(focus))$(focus).focus()}
async function loadMyCareer(force=false){
 const owner=careerOwner();if(!owner)return;if(personalCareer.owner!==owner)resetPersonalCareer();
 if(personalCareerRequest?.owner===owner)return personalCareerRequest.promise;
 if(!force&&personalCareer.checkedAt&&Date.now()-personalCareer.checkedAt<60000)return;
 const request={owner,promise:null};personalCareerRequest=request;refreshCareerMarkup();
 request.promise=(async()=>{try{
  const hub=await readRpc('get_my_coach_career_hub',{});
  if(careerOwner()!==owner||personalCareerRequest!==request)return;
  if(!hub||Array.isArray(hub)||typeof hub!=='object'||!Object.hasOwn(hub,'coach'))throw Error('The career service returned an unexpected response.');
  personalCareer={owner,data:{...hub,totals:hub.totals||{},...Object.fromEntries(['editions','chapters','timeline','honors','facts'].map(k=>[k,Array.isArray(hub[k])?hub[k]:[]]))},error:'',checkedAt:Date.now()};
 }catch(e){if(careerOwner()===owner&&personalCareerRequest===request){personalCareer.error=e.message;personalCareer.checkedAt=Date.now()}}
 finally{if(personalCareerRequest===request){personalCareerRequest=null;if(!careerOwner())render();else refreshCareerMarkup()}}})();return request.promise;
}
function refreshVisibleCareer(){if(route==='mycareer'&&!document.hidden&&!busy&&!mutationPending){connectPersonalCareerLive();if(!$('detailSheet')?.open)loadMyCareer()}else if(document.hidden)stopPersonalCareerLive()}
const careerBaseContent=content,careerBaseLegacy=legacy,careerBaseCoach=coach,careerBaseAccount=account,careerBaseNav=navSection,careerBaseRender=render;
content=function(){return route==='mycareer'?title('Your all-time legacy','My Career','Every league. Every edition.')+'<div id="careerHubRoot">'+careerHubMarkup()+'</div>':careerBaseContent()};
legacy=function(){return title('Your coaching story','Legacy')+`<button class="career-entry" onclick="go('mycareer')"><span><span class="eyebrow">YOUR ALL-TIME LEGACY</span><strong>My Career</strong><small>Every program, trophy and game edition.</small></span>${ico('arrow')}</button>`+careerBaseLegacy().replace(title(dynasty.name,'Legacy'),'')};
coach=function(){return careerBaseCoach()+(selectedCoach===myCoach()?row('My all-time career','Your records across every league and game edition',`onclick="go('mycareer')"`):'')};
account=function(){return careerBaseAccount()+row('My Career','Every league. Every edition.',`onclick="go('mycareer')"`)};
navSection=function(){return route==='mycareer'?'legacy':careerBaseNav()};
render=function(){if(personalCareer.owner!==careerOwner())resetPersonalCareer();careerBaseRender();if(route==='mycareer'&&careerOwner()&&!busy&&!loadError){loadMyCareer();connectPersonalCareerLive()}else stopPersonalCareerLive()};
window.addEventListener('focus',refreshVisibleCareer);document.addEventListener('visibilitychange',refreshVisibleCareer);setInterval(refreshVisibleCareer,60000);

// Private notifications invalidate the cache; all data is re-read through the authenticated RPC.
let personalCareerSocket=null,careerHeartbeat=null,careerReconnect=null,careerDebounce=null;
function stopPersonalCareerLive(){clearInterval(careerHeartbeat);clearTimeout(careerReconnect);clearTimeout(careerDebounce);careerHeartbeat=careerReconnect=careerDebounce=null;const socket=personalCareerSocket;personalCareerSocket=null;if(socket){socket.onclose=null;socket.close()}}
function connectPersonalCareerLive(){
 const s=session();if(personalCareerSocket||document.hidden||route!=='mycareer'||!s?.user?.id||!s.access_token||typeof WebSocket==='undefined')return;
 const owner=careerOwner(),topic='realtime:coach-career:'+s.user.id;let ref=0,token=s.access_token;
 let socket;try{socket=new WebSocket(URL.replace(/^https:/,'wss:')+'/realtime/v1/websocket?apikey='+encodeURIComponent(KEY)+'&vsn=1.0.0')}catch{return}personalCareerSocket=socket;
 const current=()=>personalCareerSocket===socket&&careerOwner()===owner&&route==='mycareer'&&!document.hidden;
 const send=(event,payload={},target=topic)=>{if(current()&&socket.readyState===1)socket.send(JSON.stringify({topic:target,event,payload,ref:String(++ref),join_ref:target===topic?'1':null}))};
 socket.onopen=()=>{if(!current()){socket.close();return}send('phx_join',{config:{broadcast:{ack:false,self:false},presence:{enabled:false},private:true},access_token:token});careerHeartbeat=setInterval(()=>{if(!current())return;const next=session()?.access_token;if(next&&next!==token){token=next;send('access_token',{access_token:token})}send('heartbeat',{},'phoenix')},25000)};
 socket.onmessage=e=>{if(!current())return;let message;try{message=JSON.parse(e.data)}catch{return}
  if(message.event==='phx_error'||message.event==='phx_close'||(message.event==='phx_reply'&&message.ref==='1'&&message.payload?.status!=='ok')){socket.close();return}
  if(message.event==='broadcast'&&message.payload?.event==='career_changed'){clearTimeout(careerDebounce);careerDebounce=setTimeout(()=>{if(current())loadMyCareer(true)},350)}
 };
 socket.onerror=()=>socket.close();socket.onclose=()=>{if(personalCareerSocket!==socket)return;personalCareerSocket=null;clearInterval(careerHeartbeat);careerHeartbeat=null;if(careerOwner()===owner&&route==='mycareer'&&!document.hidden)careerReconnect=setTimeout(connectPersonalCareerLive,5000)};
}
window.addEventListener('pagehide',stopPersonalCareerLive);window.addEventListener('pageshow',refreshVisibleCareer);window.addEventListener('online',refreshVisibleCareer);

start();</script></body></html>
