<div class="workspace"><aside id="index"></aside><main class="phone" id="app"><div class="content"><h1>Saturday Foundry</h1><p>Loading the interactive mockup…</p><noscript>Open this link in Safari or Chrome with JavaScript enabled to explore the mockup.</noscript></div></main><section class="note" id="note"></section></div><dialog class="sheet" id="detailSheet" aria-labelledby="sheetTitle"></dialog>
<script>
const A={"stadium": "https://raw.githack.com/carp09-ops/Saturday-Foundry-App/b8fe1f2689852089db4ef666b22b7a1344332ba7/assets/experience/stadium.webp", "tunnel": "https://raw.githack.com/carp09-ops/Saturday-Foundry-App/b8fe1f2689852089db4ef666b22b7a1344332ba7/assets/experience/tunnel.webp", "legacy": "https://raw.githack.com/carp09-ops/Saturday-Foundry-App/b8fe1f2689852089db4ef666b22b7a1344332ba7/assets/experience/legacy.webp", "conference": "assets/trophy-vault/conference.webp", "bowl": "assets/trophy-vault/bowl.webp", "award": "assets/trophy-vault/award.webp", "pete": "assets/coach-cards/pete-coach-card.webp"};
const S={}, order=[]; let current='home', trail=[], team='UConn';
function add(id,group,title,section,body,why,next){S[id]={id,group,title,section,body,why,next};order.push(id)}
const img=(key,cl='hero',alt='')=>`<img class="${cl}" src="${A[key]||A.legacy}" alt="${alt||key}">`;
const btn=(label,id,cl='primary')=>`<button class="${cl}" onclick="go('${id}')">${label}</button>`;
const row=(title,sub,id,icon='')=>`<button class="row" onclick="go('${id}')">${icon?`<span class="badge">${icon}</span>`:''}<span class="copy"><strong>${title}</strong><small>${sub}</small></span><span class="arrow">›</span></button>`;
const head=(k,t,p='')=>`<div class="eyebrow">${k}</div><h1>${t}</h1>${p?`<p class="muted">${p}</p>`:''}`;
const stats=(items)=>`<div class="stats">${items.map(x=>`<div><strong>${x[0]}</strong><small>${x[1]}</small></div>`).join('')}</div>`;
const table=(heads,rows)=>`<table class="table"><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map((r,i)=>`<tr class="${i===0?'pick':''}">${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
const field=(label,type='text',placeholder='')=>`<label>${label}</label><input type="${type}" placeholder="${placeholder}">`;
const chips=(items,active)=>`<div class="chips">${items.map(([t,id])=>`<button class="${id===active?'sel':''}" onclick="go('${id}')">${t}</button>`).join('')}</div>`;
const game=(a,b,sa,sb,state='FINAL',id='game')=>`<div class="game" role="button" tabindex="0" onclick="go('${id}')" onkeydown="if(event.key==='Enter')go('${id}')"><small>${state}</small><div class="score"><span><i class="badge">${a.slice(0,3).toUpperCase()}</i>${a}</span><b>${sa}</b></div><div class="score"><span><i class="badge">${b.slice(0,3).toUpperCase()}</i>${b}</span><b>${sb}</b></div></div>`;
const intro='A calmer front door. One action per step; returning members go straight to their dynasty.';
add('signin','01 · Getting in','Sign in','',()=>`${img('tunnel')} ${head('Your Saturday starts here','Welcome to the Foundry.','Your coaches. Your seasons. Your story.')}${field('Email','email','you@example.com')}${field('Password','password','Enter password')}${btn('Sign in · demo','dynasties')}${btn('Create an account','signup','secondary')}${btn('Forgot password?','reset','link')}`,intro,'dynasties');
add('signup','01 · Getting in','Create account','',()=>`${head('Join the Foundry','Create your account')}${field('Coach name','text','Your name')}${field('Email','email','you@example.com')}${field('Password','password','Choose a password')}${btn('Create account · demo','dynasties')}${btn('Already a member? Sign in','signin','link')}`,intro,'dynasties');
add('reset','01 · Getting in','Password recovery','',()=>`${head('Account access','Reset your password','Enter the email linked to your account.')}${field('Email','email','you@example.com')}${btn('Preview reset confirmation','resetdone')}`,intro,'resetdone');
add('resetdone','01 · Getting in','Recovery confirmation','',()=>`${head('Check your inbox','You’re one step away.','A real reset flow would send a secure link. This mockup sends no email.')}${btn('Back to sign in','signin')}`,intro,'signin');
add('dynasties','01 · Getting in','Your dynasties','',()=>`${head('Welcome back, Pete','Your dynasties','Pick up where you left off.')}${row('Foundry 2.0','Week 5 · UConn · 4 coaches','home','SF')}${row('Saturday Night Lights','Season archive · View history','archive','SN')}${btn('Join with an invite','join')}${btn('Create a dynasty','create','secondary')}`,intro,'teamsel');
add('join','01 · Getting in','Join a dynasty','',()=>`${head('Find your league','Join the next chapter')}${field('Invite code','text','FOUNDRY-2026')}${btn('Preview invitation','invite')}`,intro,'invite');
add('invite','01 · Getting in','Accept invitation','',()=>`${head('You’re invited','Foundry 2.0','A college football dynasty with friends.')}${stats([['4','Coaches'],['5','Current week'],['2.0','League']])}${btn('Choose a program','teamsel')}`,intro,'teamsel');
add('create','01 · Getting in','Create dynasty','',()=>`${head('Start something lasting','Your new dynasty')}${field('Dynasty name','text','Saturday Night Lights')}${field('Season label','text','Season 1')}${btn('Continue to program selection','teamsel')}`,intro,'teamsel');
add('teamsel','01 · Getting in','Select a program','',()=>`${head('Foundry 2.0','Choose your program','Your career follows your coach, even when your program changes.')}<label>Search programs</label><input placeholder="Search team or conference" oninput="filterTeams(this.value)"><div id="teamchoices">${['UConn','Texas State','Boise State'].map(n=>`<button class="row teamchoice" onclick="team='${n}';go('teamconfirm')"><span class="badge">${n.slice(0,3).toUpperCase()}</span><span class="copy"><strong>${n}</strong><small>Available</small></span><span class="arrow">›</span></button>`).join('')}<div class="row teamchoice"><span class="badge">ARM</span><span class="copy"><strong>Army</strong><small>Claimed · Corey</small></span></div></div>`,intro,'teamconfirm');
add('teamconfirm','01 · Getting in','Confirm program','',()=>`${head('Your next chapter',team,'You can review the program before joining.')}${img('stadium')}${btn('Enter the dynasty · demo','home')}${btn('Choose another program','teamsel','secondary')}`,intro,'home');
add('home','02 · League home','Home','Home',()=>`${head('Foundry 2.0 · Week 5','The Saturday report')}${img('stadium')}<div class="eyebrow">Lead story</div><h2 class="lead">UConn makes a statement on the road.</h2><p class="muted">A complete performance sets the tone for a pivotal stretch.</p>${btn('Read the story','article','link')}<h2>Your week</h2>${row('UConn 44, Temple 10','Final · View game center','game','CON')}<h2>Around the Foundry</h2>${row('The race in the American','Conference picture','standings')}${row('Pete’s next chapter','Coach profile','coach')}${row('Who’s moving up?','This week’s power rankings','power')}${row('Explore the league','Stories, analysis, rivalries and archives','explore')}`,'One lead story, one personal action, then a short news feed. No wall of competing panels.','scores');
add('explore','02 · League home','Explore the league','Home',()=>`${head('Everything in one place','Explore')}${row('Analysis','Power, luck, clutch, streaks and comparisons','analysis')}${row('The market','Game lines, trends and history','market')}${row('Weekly stories','The league’s latest edition','stories')}${row('Rivalries','Head-to-head records and history','rivalries')}${row('Playoff picture','Rankings and projected bracket','playoff')}${row('Season archive','Every chapter, organized by year','archive')}${row('Commissioner office','League management','office')}`,'A visible directory replaces scattered “More” tabs. These destinations also appear in context throughout the app.','analysis');
add('stories','02 · League home','Weekly stories','Home',()=>`${head('The Saturday report','Week 5 edition')}${img('stadium')}${row('UConn makes a statement','Lead story · 4 min read','article')}${row('The conference race tightens','Around the league · 3 min read','article')}${row('Coaches behind the programs','Career chronicles','chronicles')}${row('Previous editions','Season archive','archive')}`,'Story lists read like a sports front page, with a clear route into long-form coverage.','article');
add('article','02 · League home','Story detail','Home',()=>`${head('Week 5 · League coverage','UConn makes a statement on the road.','Illustrative editorial copy · The Saturday report')}${img('stadium')}<p>A 44–10 win at Temple gives UConn a result worth remembering. The cleanest view of the week starts with what happened on the field.</p><p>In the finished experience, this space would tell the story behind the result, with links to the game, the coach and the wider conference race.</p><h2>Follow the story</h2>${row('UConn at Temple','Final · Game center','game')}${row('Meet the coach','Pete’s career','coach')}${row('American standings','View conference table','standings')}`,'Reading stays uninterrupted; related games and people are linked below the story.','coach');
add('scores','03 · Scores & results','Scores','Scores',()=>`${head('Foundry 2.0','Scores')}<label>Week</label><select onchange="document.getElementById('weekhint').textContent='Showing illustrative '+this.value+' layout'"><option>Week 5</option><option>Week 4</option><option>Week 3</option></select><p class="muted" id="weekhint">Thursday, September 28 – Saturday, September 30</p>${chips([['All games','scores'],['My schedule','schedule']],'scores')}${game('TCU','Kansas',10,17)}${game('UConn','Temple',44,10)}${game('Army','Tulsa','—','—','SAT · 7:00 PM','pregame')}${btn('Add a missing game','addgame','link')}`,'Matchups are the content. Each row opens a game center rather than expanding another nested panel.','game');
add('game','03 · Scores & results','Game center · final','Scores',()=>`${head('Week 5 · Final','UConn at Temple')}${game('UConn','Temple',44,10)}${stats([['34','Point margin'],['Away','UConn'],['Final','Status']])}<h2>By quarter</h2>${table(['TEAM','1','2','3','4'],[['CON','14','10','7','13'],['TEM','0','3','7','0']])}<p class="muted">Quarter breakdown is illustrative.</p>${row('UConn team page','Schedule, stats and coach','team')}${row('Read the recap','The Saturday report','article')}${btn('Review or correct result','result','secondary')}`,'One permanent home for a game: result, recap, team links and corrections.','result');
add('pregame','03 · Scores & results','Game center · upcoming','Scores',()=>`${head('Week 5 · Saturday, 7:00 PM','Army at Tulsa')}${game('Army','Tulsa','—','—','UPCOMING','pregame')}${row('Matchup outlook','Illustrative line and team comparison','odds')}${btn('Enter result','result')}`, 'Upcoming and final games share the same layout, with a clear state-specific action.','result');
add('result','03 · Scores & results','Enter a result','Scores',()=>`${head('Game result','Enter the final score','Demo form · Changes are never submitted.')}${field('Away team score','number','44')}${field('Home team score','number','10')}<label>Finish</label><select><option>Regulation</option><option>Overtime</option></select>${btn('Review result','resultreview')}`,'A focused form keeps data entry separate from browsing.','resultreview');
add('resultreview','03 · Scores & results','Review result','Scores',()=>`${head('Confirm the details','Ready to record?')}${game('UConn','Temple',44,10)}<div class="notice">This preview uses a fixed sample result. No league data will change.</div>${btn('Preview confirmation','resultdone')}${btn('Edit score','result','secondary')}`,'A review step makes the result and game identity explicit.','resultdone');
add('resultdone','03 · Scores & results','Result confirmation','Scores',()=>`${head('Demo complete','Result recorded.','This is a simulated success screen. Nothing was saved.')}${btn('View game center','game')}${row('Opponent confirmation','Preview human-vs-human review','h2h')}`,'Success tells you what happened and where to go next.','h2h');
add('h2h','03 · Scores & results','Opponent verification','Scores',()=>`${head('Head-to-head review','Confirm your matchup','An opponent-submitted result needs your review.')}${game('UConn','Army',24,31,'AWAITING CONFIRMATION')} ${btn('Preview confirmed state','resultdone')}${btn('Flag a score mismatch','dispute','secondary')}`,'Opponent review is a task page, not a hidden status buried in the schedule.','dispute');
add('dispute','03 · Scores & results','Result dispute','Scores',()=>`${head('Score mismatch','Ask for a review')}${field('Your expected score','text','UConn 24 · Army 28')}${field('What needs correcting?','text','Explain the mismatch')}${btn('Preview review queue','queue')}`,'A disputed result routes to a commissioner queue with clear ownership.','queue');
add('addgame','03 · Scores & results','Add / edit game','Scores',()=>`${head('Schedule management','Game details')}${field('Away team','text','UConn')}${field('Home team','text','Temple')}${field('Week','number','5')}${field('Kickoff','text','Saturday · 8:00 PM')}${btn('Preview updated schedule','scores')}`,'Creation and editing reuse one simple form.','scores');
add('teams','04 · Teams & coaches','Teams directory','Teams',()=>`${head('Foundry 2.0','Teams & coaches')}<label>Find a program or coach</label><input placeholder="Search teams and coaches" oninput="filterRows(this.value)"><div id="searchrows">${row('UConn','Pete · View program','team','CON')}${row('Army','Corey · Sample directory entry','coach','ARM')}${row('Texas State','Program profile preview','team','TXS')}${row('Boise State','Program profile preview','team','BOI')}</div><p class="muted">Other directory rows open the featured sample profile.</p>`,'Programs and people share one directory. Coach profiles are first-class destinations.','team');
add('team','04 · Teams & coaches','Team overview','Teams',()=>`${head('American · Foundry 2.0','UConn Huskies','Coached by Pete')}${stats([['4–1','Overall · sample'],['2–0','Conference · sample'],['17','Rank · sample']])}${img('stadium')}<h2>Latest result</h2>${game('UConn','Temple',44,10)}${row('Full schedule','Completed and upcoming games','schedule')}${row('Team statistics','Scoring, defense and trends','teamstats')}${row('Pete','Coach profile & career','coach','P')}${row('Program rivalries','Head-to-head history','rivalries')}`,'Team overview contains the essentials with explicit rows into deeper pages.','coach');
add('schedule','04 · Teams & coaches','Team schedule','Teams',()=>`${head('UConn Huskies','Season schedule')}${game('Army','UConn',48,24,'WEEK 2 · FINAL')}${game('UConn','East Carolina',45,24,'WEEK 3 · FINAL')}${game('UConn','North Texas',47,3,'WEEK 4 · FINAL')}${game('UConn','Temple',44,10,'WEEK 5 · FINAL')}${btn('Back to team','team','link')}`,'A chronological team schedule complements the league-wide weekly scoreboard.','teamstats');
add('teamstats','04 · Teams & coaches','Team statistics','Teams',()=>`${head('UConn · Sample statistics','The season in numbers')}${stats([['38.6','Points / game'],['19.2','Allowed / game'],['+19.4','Average margin']])}${table(['CATEGORY','UCONN','LEAGUE RANK'],[['Scoring offense','38.6','4'],['Scoring defense','19.2','6'],['Win percentage','.800','5']])}${row('Compare teams','Side-by-side season context','compare')}${row('Game-by-game results','Schedule','schedule')}`,'A small set of readable metrics first; comparisons are a deliberate next step.','coach');
add('coach','04 · Teams & coaches','Coach card · Pete','Teams',()=>`${head('Coach profile','Pete','UConn · Foundry 2.0')}${img('pete','portrait','Pete’s original approved coach card')}${stats([['42–18','Career · sample'],['3','Titles · sample'],['5','Seasons · sample']])}${row('Trophy room','Championships, bowls and awards','trophies')}${row('Career journey','Every program, one coaching story','career')}${row('Coach chronicle','The story behind the record','chronicles')}${row('Head-to-head','Rivalries and opponent records','rivalries')}`,'The original collectible portrait stays intact. Career information sits in clean rows below it.','trophies');
add('career','04 · Teams & coaches','Career journey','Teams',()=>`${head('Pete · Sample career','Programs are chapters.','The coach is the dynasty.')}<div class="timeline"><article><span class="eyebrow">Current chapter</span><h2>UConn</h2><p class="muted">Season 5 · Building the next contender</p></article><article><span class="eyebrow">Previous chapter · illustrative</span><h2>A program on the rise</h2><p class="muted">Seasons 2–4 · Conference title and a bowl victory</p></article><article><span class="eyebrow">The beginning</span><h2>First season in the Foundry</h2><p class="muted">Season 1 · A new coaching story</p></article></div>${row('Career honors','Visit the trophy room','trophies')}${row('Season archive','Open a chapter','archive')}`,'A timeline makes coaching continuity tangible without turning it into a dense statistics sheet.','chronicles');
add('chronicles','04 · Teams & coaches','Coach chronicle','Teams',()=>`${head('The coaches’ chronicles','The next chapter','Pete · Illustrative narrative')}${img('tunnel')}<p>Every program leaves a mark on a coach. The uniforms change. The ambition travels.</p><p>This is the long-form home for a coach’s story: defining games, turning points and the seasons that made a reputation.</p>${row('The record behind the story','Career journey','career')}${row('Defining moments','Trophy room','trophies')}`,'Lore is available when you want to read it, without occupying the main dashboard.','standings');

function buildIndex(q=''){let groups={};order.forEach(id=>{let s=S[id];if((s.title+' '+s.group).toLowerCase().includes(q.toLowerCase()))(groups[s.group]??=[]).push(s)});document.getElementById('indexlist').innerHTML=Object.entries(groups).map(([g,ss])=>`<h3>${g}</h3>${ss.map(s=>`<button class="${s.id===current?'active':''}" onclick="go('${s.id}')">${s.title}</button>`).join('')}`).join('')}
function render(){let s=S[current];let entry=s.group.startsWith('01');document.getElementById('position').textContent=`${order.indexOf(current)+1} / ${order.length} screens · Sample content · No data saves`;document.getElementById('app').innerHTML=`<div class="mast"><span class="shield">SF</span><span class="word">SATURDAY FOUNDRY</span><button class="switch" onclick="go('account')" aria-label="Account and dynasty menu">${entry?'Help':'Pete ☰'}</button></div>${entry?'':`<nav class="appnav" aria-label="Main navigation">${[['Home','home'],['Scores','scores'],['Teams','teams'],['Standings','standings'],['Legacy','legacy']].map(([n,id])=>`<button class="${s.section===n?'on':''}" onclick="go('${id}')">${n}</button>`).join('')}</nav>`}${current==='home'?'<div class="ticker">FINAL · CON <b>44</b> TEM <b>10</b><span>FINAL · KU <b>17</b> TCU <b>10</b></span></div>':''}<div class="crumb"><button onclick="back()">‹ Back</button><span>${entry?'Welcome':s.group.slice(5)}</span></div><div class="content">${s.body()}<p class="fixture">DESIGN CONCEPT · SAMPLE CONTENT · NO LIVE DATA</p></div><div class="footer">Saturday Foundry · Preview 03 · Graphite & Crimson</div>`;document.getElementById('note').innerHTML=`<div class="eyebrow">Design review</div><h2>${s.title}</h2><p>${s.why}</p><div class="path"><strong>Suggested next step</strong><br>${S[s.next]?.title||'Home'}</div><button class="reviewnext" onclick="go('${s.next||'home'}')">Continue this flow →</button><h2 style="margin-top:30px">Review the full journey</h2><p>Use the screen index to jump anywhere. Buttons inside the mockup connect related screens.</p><p class="muted">Illustrative data only. Coach assignments, statistics, awards, and stories are fixtures. Pete’s original approved card artwork is preserved.</p>`;buildIndex(document.getElementById('screenSearch').value);document.body.classList.remove('indexopen')}

function scard(g,featured=false){return `<article class="sports-card"><div class="cardmeta"><span>${featured?'YOUR TEAM · ':''}WEEK ${g.w}</span><span class="result-state">${g.final?'FINAL':g.time}</span></div><button class="match-open" onclick="openGame('${g.id}')" aria-label="${g.away} ${g.a??''} at ${g.home} ${g.h??''}, ${g.final?'final':'upcoming'}"><div class="match-team">${logo(g.away)}<span>${g.away}</span><b class="${g.final&&g.a<g.h?'loser':''}">${g.a??'—'}</b></div><div class="match-team">${logo(g.home)}<span>${g.home}</span><b class="${g.final&&g.h<g.a?'loser':''}">${g.h??'—'}</b></div></button><div class="match-foot"><button onclick="openGame('${g.id}')">${g.final?'Game summary':'Matchup preview'} ${ico('arrow')}</button>${featured?`<button onclick="go('team')">Team page ${ico('arrow')}</button>`:`<button onclick="openGame('${g.id}')">${g.final?'Details':'View game'}</button>`}</div></article>`}

function jumpTo(id){document.getElementById(id)?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'instant':'smooth',block:'start'})}
function scheduleRows(games){return games.map(g=>{const home=g.home==='UConn',opp=home?g.away:g.home,ours=home?g.h:g.a,theirs=home?g.a:g.h;return `<button class="schedule-row" onclick="openGame('${g.id}')"><small>Wk ${g.w}</small>${logo(opp)}<span>${home?'vs':'at'} ${opp}</span><span class="outcome ${ours<theirs?'loss':''}">${ours>theirs?'W':'L'}</span><b>${ours}–${theirs}</b></button>`}).join('')}
const honorList=[['conference','Conference title','Season 4'],['bowl','Bowl champion','Season 3'],['award','Player award','Season 4']];
function honors(){return `<div class="honors-strip">${honorList.map(([k,t,y])=>`<button onclick="showHonor('${k}')">${img(k,'',t)}<strong>${t}</strong><small>${y} · Sample</small></button>`).join('')}</div>`}

S.coach.body=()=>`<div class="coach-feature"><div><div class="eyebrow">COACH PROFILE</div><h1>Pete</h1><p>Foundry 2.0</p><div class="mini-program">${logo('UConn')} UConn Huskies</div></div><button class="card-preview" onclick="showCoachCard()" aria-label="Open Pete’s full coach card">${img('pete','','Pete’s original approved coach portrait')}<span>View coach card ↗</span></button></div><div class="statline"><div><strong>42–18</strong><small>Career record*</small></div><div><strong>3</strong><small>Championships*</small></div><div><strong>5</strong><small>Seasons*</small></div></div><nav class="section-jumps" aria-label="Jump to coach section"><button onclick="jumpTo('coachHonors')">Honors</button><button onclick="jumpTo('coachCareer')">Career</button><button onclick="jumpTo('coachRivals')">Rivalries</button></nav><section class="team-section" id="coachHonors">${sect('Trophy shelf','trophies','Trophy room')}${honors()}</section><section class="team-section" id="coachCareer">${sect('Career journey','career','Full career')}<div class="career-short"><article><span class="eyebrow">CURRENT CHAPTER</span><br><strong>UConn Huskies</strong><small>Season 5 · Building the next contender</small></article><article><strong>A championship chapter</strong><small>Season 4 · Conference title · Sample honor</small></article></div></section><section class="team-section" id="coachRivals">${sect('Head-to-head','rivalries','All rivalries')}<button class="series-row" style="width:100%;text-align:left" onclick="go('rivalry')"><span>vs Corey</span><b>4–3*</b></button><button class="series-row" style="width:100%;text-align:left" onclick="go('rivalry')"><span>vs Saif</span><b>2–2*</b></button></section>${sect('The coach’s story')}${news('Programs are chapters. The coach is the dynasty.','READ PETE’S CHRONICLE','chronicles','tunnel')}<p class="sport-note">*Illustrative career totals and honors.</p>`;

S.teams.body=()=>`${head('Foundry 2.0','Teams & coaches')}<div class="searchbox">${ico('search')}<input aria-label="Search teams and coaches" placeholder="Find a team or coach" oninput="filterRows(this.value)"></div><div id="searchrows"><button class="team-directory-row row" onclick="go('team')">${logo('UConn')}<span><strong>UConn Huskies</strong><small>Your program · Pete</small></span>${ico('arrow')}</button><button class="team-directory-row row" onclick="go('rivalry')">${logo('Army')}<span><strong>Army Black Knights</strong><small>Corey · Open featured rivalry</small></span>${ico('arrow')}</button><button class="team-directory-row row" onclick="openGame('w5-mem')">${logo('Memphis')}<span><strong>Memphis Tigers</strong><small>Week 5 · Matchup preview</small></span>${ico('arrow')}</button></div>${sect('Your coach') }<button class="coach-mini" onclick="go('coach')">${img('pete','','Pete')}<span><strong>Pete</strong><small>Career record · 42–18*</small><small>3 championships · Sample</small></span>${ico('arrow')}</button><p class="sport-note">Sample directory with featured team, coach and matchup destinations.</p>`;

function gameCenter(g){const winner=g.a>g.h?g.away:g.home;return `${head('WEEK '+g.w+' · '+g.date,g.away+' at '+g.home)}<div class="game-scorehero"><div>${logo(g.away)}<strong>${g.away}</strong><b>${g.a??'—'}</b><small>Away</small></div><div class="game-status">${g.final?'Final':g.time}</div><div>${logo(g.home)}<strong>${g.home}</strong><b>${g.h??'—'}</b><small>Home</small></div></div><div class="info-strip">${g.final?`${winner} wins by ${Math.abs(g.a-g.h)} · Final result`:'Upcoming · Week '+g.w}</div>${g.final?`${sect('Game summary')}<p class="article-inline">${winner} finishes on top, ${Math.max(g.a,g.h)}–${Math.min(g.a,g.h)}. Follow the result into the team page, league scoreboard or conference picture.</p>${g.id==='w5-con'?`${table(['TEAM','1','2','3','4','T'],[['CON','14','10','7','13','44'],['TEM','0','3','7','0','10']])}<p class="sport-note">Quarter-by-quarter breakdown is illustrative.</p>`:''}${sect('Follow the game')}${g.away==='UConn'||g.home==='UConn'?row('UConn Huskies','Team overview, schedule and coach','team'):row('League picture','Standings and rankings','standings')}${row('Week '+g.w+' scoreboard','Other results and upcoming games','scores')}${g.id==='w5-con'?row('Read the recap','The Saturday report','article'):''}${btn('Review or correct score','result','secondary')}`:`${sect('Before kickoff')}<p class="article-inline">Matchup context and game entry stay together. Final scores replace this preview after the result is recorded.</p>${g.id==='w5-army'?`${stats([['−7.5','Army spread*'],['52.5','Total*'],['68%','Win chance*']])}<p class="sport-note">*Illustrative model estimates.</p>`:''}${btn('Enter result','result')}${row('Week 5 scoreboard','Browse the remaining games','scores')}`}`}
S.game.body=()=>{if(!currentMatch().final)selectedMatch='w5-con';return gameCenter(currentMatch())};S.pregame.body=()=>{if(currentMatch().final)selectedMatch='w5-army';return gameCenter(currentMatch())};
S.game.why='The selected matchup stays consistent from scoreboard to game center. Its final score leads, with the summary and related destinations immediately below.';

let enteredResult=null;
S.result.body=()=>{let g=enteredResult?.id===selectedMatch?enteredResult:currentMatch();return `${head('Week '+g.w+' · Demo entry',g.away+' at '+g.home,'Enter a score to preview the review flow. Nothing is saved.')}<form onsubmit="event.preventDefault();reviewEnteredResult(this)"><label for="awayScore">${g.away} score</label><input id="awayScore" name="awayScore" type="number" min="0" max="200" required value="${g.a??''}" inputmode="numeric"><label for="homeScore">${g.home} score</label><input id="homeScore" name="homeScore" type="number" min="0" max="200" required value="${g.h??''}" inputmode="numeric"><label for="finish">Finish</label><select id="finish" name="finish"><option>Regulation</option><option>Overtime</option></select><button class="primary" type="submit">Review result</button></form>`};
function reviewEnteredResult(form){enteredResult={...currentMatch(),a:Number(form.elements.namedItem('awayScore').value),h:Number(form.elements.namedItem('homeScore').value),final:true,finish:form.elements.namedItem('finish').value};go('resultreview')}

S.resultdone.body=()=>`${head('Demo complete','Result flow complete.','Your review is finished. No data was saved or submitted.')}${btn('Return to game center',currentMatch().final?'game':'pregame')}`;
S.legacy.body=()=>`${head('The history you’re building','Legacy')}${img('legacy','legacy-hero','The Foundry trophy collection')}${sect('Your trophy shelf','trophies','Trophy room')}${honors()}${sect('The record book','records','All records')}${table(['COACH','WINS*','TITLES*'],[['Pete','42','3'],['Corey','39','2'],['Saif','36','2']])}<p class="sport-note">*Illustrative career records.</p>${sect('Every season leaves a story','archive','All seasons')}${news('Season 4: a championship chapter','SEASON RECAP · SAMPLE','recap','stadium')}${row('Dynasty milestones','Progress, tiers and defining moments','milestones')}${row('Rivalries','The history between the coaches','rivalries')}`;

S.titles.body=()=>`${head('Pete · Sample honors','Championships')}<div class="trophygrid">${honorList.slice(0,2).map(([k,t,y])=>`<button onclick="showHonor('${k}')">${img(k,'',t)}<strong>${t}</strong><small>${y} · Sample</small></button>`).join('')}</div>${btn('All honors','trophies','secondary')}`;

function closeSheet(){document.getElementById('detailSheet').close()}
function openSheet(title,body){let d=document.getElementById('detailSheet');d.innerHTML=`<div class="sheet-head"><span id="sheetTitle">${title}</span><button autofocus onclick="closeSheet()" aria-label="Close detail">${ico('close')}</button></div><div class="sheet-body">${body}</div>`;d.showModal();d.scrollTop=0}
function showCoachCard(){openSheet('Pete · Coach card',`${img('pete','portrait','Pete’s original approved coach card')}<p class="muted" style="margin-top:12px">Original coach artwork · Foundry 2.0</p>`)}
function showHonor(key){const entry=honorList.find(h=>h[0]===key)||honorList[0];openSheet('Career honor',`${head(entry[2]+' · SAMPLE HONOR',entry[1])}${img(entry[0],'awardhero',entry[1])}<h2>A chapter worth keeping.</h2><p class="muted">Part of Pete’s career collection. Honors stay with the coach across programs and seasons.</p>${table(['DETAIL','VALUE'],[['Coach','Pete'],['Season',entry[2]],['Type',entry[1]]])}<button class="primary" onclick="closeSheet();go('recap')">View season recap</button>`)}

function render(){let s=S[current],entry=s.group.startsWith('01'),section=navSection(s);const root=['home','scores','teams','standings','legacy'].includes(current);document.getElementById('position').textContent=`Preview 04 · Sample content · ${order.indexOf(current)+1}/${order.length}`;document.getElementById('app').innerHTML=`<div class="mast"><span class="shield">SF</span><span class="word">SATURDAY FOUNDRY<small>${entry?'YOUR COACHING STORY':'FOUNDRY 2.0 · WEEK 5'}</small></span><div class="mast-actions">${entry?'':`<button onclick="go('notifications')" aria-label="Notifications">${ico('bell')}</button>`}<button class="avatar" onclick="go('${entry?'help':'account'}')" aria-label="${entry?'Help':'Account and league menu'}">${entry?'?':'P'}</button></div></div><div class="viewport" id="screenViewport">${root?'':`<div class="crumb"><button onclick="back()">${ico('back')} Back</button><span>${entry?'Welcome':section||'League office'}</span></div>`}<div class="content">${s.body()}<p class="fixture">DESIGN PREVIEW · ILLUSTRATIVE CONTENT · NO LIVE DATA</p></div><div class="footer">Saturday Foundry · Preview 04 · Graphite & Crimson</div></div>${entry?'':`<nav class="bottomnav" aria-label="Main navigation">${[['Home','home','home'],['Scores','scores','scores'],['Teams','teams','teams'],['Standings','standings','standings'],['Legacy','legacy','legacy']].map(([n,id,ic])=>`<button class="${section===n?'on':''}" ${section===n?'aria-current="page"':''} onclick="go('${id}')">${ico(ic)}<span>${n}</span></button>`).join('')}</nav>`}`;document.getElementById('note').innerHTML=`<div class="eyebrow">PREVIEW 04 · DESIGN NOTES</div><h2>${s.title}</h2><p>${s.why}</p><div class="path"><strong>Continue the flow</strong><br>${S[s.next]?.title||'Home'}</div><button class="reviewnext" onclick="go('${s.next||'home'}')">${S[s.next]?.title||'Home'} →</button><h2 style="margin-top:28px">Designed for your phone</h2><p>Five persistent destinations. Useful overview pages. Details open where they belong.</p><p class="muted">The screen directory is a review tool. It is not part of the proposed app navigation.</p>`;buildIndex(document.getElementById('screenSearch').value);document.body.classList.remove('indexopen');}
function go(id){if(!S[id])throw Error('Unknown screen '+id);let vp=document.getElementById('screenViewport');if(current!==id)trail.push({id:current,scroll:vp?.scrollTop||0});current=id;history.pushState(null,'','#'+id);render();}
function back(){let previous=trail.pop();current=previous?.id||'home';history.replaceState(null,'','#'+current);render();document.getElementById('screenViewport').scrollTop=previous?.scroll||0}

document.getElementById('index').innerHTML='<button class="indexclose" onclick="document.body.classList.remove(&quot;indexopen&quot;)" aria-label="Close screen directory">×</button><div class="indexlabel">SCREEN DIRECTORY</div><input id="screenSearch" class="searchindex" placeholder="Find a screen…" oninput="buildIndex(this.value)"><div id="indexlist"></div>';
if(S[location.hash.slice(1)])current=location.hash.slice(1);render();window.addEventListener('hashchange',()=>{let id=location.hash.slice(1);if(S[id]&&id!==current){current=id;render()}});
window.mockup={screens:S,order,go};
