      const records=group.map(team=>{
        const opponents=group.filter(other=>other!==team).map(other=>team.headToHead.get(other.key));
        return {team,complete:opponents.every(r=>r&&r.w+r.l>0),sweep:opponents.every(r=>r&&r.w>0&&r.l===0),w:opponents.reduce((n,r)=>n+(r?.w||0),0),l:opponents.reduce((n,r)=>n+(r?.l||0),0)};
      });
      let top=[];
      if(records.every(r=>r.complete)){
        const best=Math.max(...records.map(r=>r.w/(r.w+r.l)));
        top=records.filter(r=>r.w/(r.w+r.l)===best).map(r=>r.team);
      }else top=records.filter(r=>r.sweep).map(r=>r.team);
      if(!top.length||top.length===group.length)return [[...group].sort(byName)];
      return [...resolve(top),...resolve(group.filter(t=>!top.includes(t)))];
    }
    const groups=[];
    for(const team of [...teams].sort((a,b)=>pct(b)-pct(a)||byName(a,b))){
      const last=groups[groups.length-1];
      if(last&&pct(last[0])===pct(team))last.push(team);else groups.push([team]);
    }
    const rows=[];
    for(const group of groups.flatMap(resolve)){
      const rank=rows.length+1,played=pct(group[0])>=0;
      group.forEach(t=>rows.push({...t,raceRank:rank,raceTied:group.length>1,racePlayed:played,raceQualifier:played&&rank+group.length-1<=2}));
    }
    return rows;
  }

return {teams:build(), americanRows,isAmerican,isSunBelt,sunBeltDivision,sortRows};
}

function scores(){let weeks=[...new Set([...games().map(g=>num(g.week_number)),week])].sort((a,b)=>a-b);let list=games().filter(g=>num(g.week_number)===week).filter(g=>scope==='mine'?(g.awayId===myTeam()||g.homeId===myTeam()):scope==='final'?g.final:scope==='upcoming'?!g.final:true);return title(dynasty.name,'Scores')+`<div class="weekstrip" aria-label="Choose week">${weeks.map(w=>`<button class="${w===week?'selected':''}" aria-pressed="${w===week}" onclick="chooseWeek(${w})">Week ${w}</button>`).join('')}</div><div class="filterbar">${[['all','All games'],['mine','My team'],['final','Final'],['upcoming','Upcoming']].map(([s,t])=>`<button class="${scope===s?'sel':''}" aria-pressed="${scope===s}" onclick="chooseScope('${s}')">${t}</button>`).join('')}</div><p class="sport-note">${list.length} ${list.length===1?'game':'games'} · Season ${esc(season.season_number)}</p>${list.map(g=>card(g)).join('')||empty(scope==='mine'&&!myTeam()?'You have no assigned team in this season.':'No games match this week and filter.')}`}
function teams(){const p=model.programs,ids=[...new Set(games().flatMap(g=>[g.awayId,g.homeId]))].filter(id=>!p.some(p=>p.team_id===id));return title(dynasty.name,'Teams & coaches')+`<div class="searchbox">${ico('search')}<input aria-label="Search teams and coaches" placeholder="Find a team or coach" oninput="filterTeams(this.value)"></div>${section('Foundry programs')}${p.map(t=>`<button class="team-directory-row" data-search="${esc((t.team_name+' '+t.coach_name).toLowerCase())}" onclick="openTeam('${uid(t.team_id)}')">${logo(t.team_id,t.team_name)}<span><strong>${esc(t.team_name)}</strong><small>${esc(t.coach_name||'Coach not assigned')}${t.team_id===myTeam()?' · Your team':''}</small></span>${ico('arrow')}</button>`).join('')||empty('No coach assignments are recorded for this season.')}${section('Around the country')}${ids.sort((a,b)=>teamData(a).name.localeCompare(teamData(b).name)).map(id=>{const t=teamData(id);return `<button class="team-directory-row" data-search="${esc(t.name.toLowerCase())}" onclick="openTeam('${uid(id)}')">${logo(id,t.name)}<span><strong>${esc(t.name)}</strong><small>${esc(t.conference||'')}</small></span>${ico('arrow')}</button>`}).join('')}`}
function team(){if(!selectedTeam)return empty('Choose a team from the directory.');const t=teamData(selectedTeam),p=program(),r=record(selectedTeam),gs=teamGames(),latest=gs.filter(g=>g.final).at(-1);return `<div class="team-header">${logo(selectedTeam,t.name)}<div><div class="eyebrow">${esc(p?.conference||t.conference||'PROGRAM')}</div><h1>${esc(t.name)}</h1><p>${r.w}–${r.l} overall · Season ${esc(season.season_number)}</p></div></div><nav class="section-jumps" aria-label="Team sections">${['Latest','Schedule','Stats','Coach'].map(k=>`<button onclick="jump('team${k}')">${k}</button>`).join('')}</nav><section id="teamLatest" class="team-section">${section('Latest result')}${latest?card(latest):empty('No completed games have been recorded.')}</section><section id="teamSchedule" class="team-section">${section('Season schedule')}${scheduleRows(gs)||empty('No schedule is available.')}</section><section id="teamStats" class="team-section">${section('Season at a glance')}${statline([[r.gp?fmt(r.pf/r.gp):'—','Points per game'],[r.gp?fmt(r.pa/r.gp):'—','Points allowed'],[r.gp?fmt((r.pf-r.pa)/r.gp):'—','Average margin']])}</section><section id="teamCoach" class="team-section">${section('On the sideline')}${p?.person_id?`<button class="coach-mini" onclick="openCoach('${uid(p.person_id)}')">${coachArt(p.coach_name)}<span><strong>${esc(p.coach_name)}</strong><small>Head coach · ${esc(t.name)}</small><small>Career, honors & rivalries</small></span>${ico('arrow')}</button>`:empty('This is a CPU program. No Foundry coach is assigned.')}</section>`}
function coach(){const c=coachInfo(),items=honors(selectedCoach),stops=model.stops.filter(s=>s.person_id===selectedCoach),active=model.programs.find(p=>p.person_id===selectedCoach);return `<div class="coach-feature"><div>${title('Coach profile',c.coach_name,dynasty.name)}${active?`<button class="mini-program" onclick="openTeam('${uid(active.team_id)}')">${logo(active.team_id,active.team_name)} ${esc(active.team_name)}</button>`:''}</div><button class="card-preview" onclick="showCoachCard()" ${artwork(c.coach_name)?'':'disabled'} aria-label="Open full coach card">${coachArt(c.coach_name)}${artwork(c.coach_name)?'<span>View coach card ↗</span>':''}</button></div>${statline([[c.wins!=null?c.wins+'–'+c.losses:'—','Career record'],[items.length,'Recorded honors'],[new Set(stops.map(s=>s.season_id)).size,'Seasons']])}<nav class="section-jumps"><button onclick="jump('coachHonors')">Honors</button><button onclick="jump('coachCareer')">Career</button><button onclick="jump('coachRivals')">Rivalries</button></nav><section class="team-section" id="coachHonors">${section('Trophy shelf','trophies','Trophy room')}${trophyGrid(items,3)}</section><section class="team-section" id="coachCareer">${section('Career journey','career','Full career')}${careerRows(stops.slice(0,3))}</section><section class="team-section" id="coachRivals">${section('Head-to-head','rivalries','All rivalries')}${rivalryRows().slice(0,3).join('')||empty('No games against other Foundry coaches are recorded.')}</section><p class="sport-note">Career totals cover ${esc(dynasty.name)} across its recorded seasons.</p>`}
function careerRows(stops){return stops.length?`<div class="career-short">${stops.map(s=>`<article><strong>${esc(s.team_name)}</strong><small>Season ${esc(s.season_number)} · ${esc(s.wins)}–${esc(s.losses)}${s.current_assignment?' · Current assignment':''}</small></article>`).join('')}</div>`:empty('No career stops are available.')}
function rivalryRows(){const rows=new Map();for(const g of model.history.filter(g=>g.person_id===selectedCoach)){const opponent=model.history.find(o=>o.id===g.id&&o.person_id&&o.person_id!==selectedCoach);if(!opponent||g.points_for==null||g.points_against==null)continue;const r=rows.get(opponent.person_id)||{name:opponent.coach_name,w:0,l:0,seen:new Set()};if(r.seen.has(g.id))continue;r.seen.add(g.id);r[g.points_for>g.points_against?'w':'l']++;rows.set(opponent.person_id,r)}return [...rows].sort((a,b)=>(b[1].w+b[1].l)-(a[1].w+a[1].l)).map(([id,r])=>`<div class="series-row"><span>vs ${esc(r.name)}</span><b>${r.w}–${r.l}</b></div>`)}
function standings(){const cm=conferenceModel(model),confs=[...new Set(cm.teams.map(t=>t.conf))].sort();if(!confs.includes(conference))conference=confs[0]||'';let ts=cm.teams.filter(t=>t.conf===conference),american=cm.isAmerican(conference);ts=american?cm.americanRows(ts):ts.sort(cm.sortRows);function standingsTable(list){return table(['#','TEAM','CONF','OVERALL','PCT'],list.map((t,i)=>[american?(t.racePlayed?(t.raceTied?'T':'')+t.raceRank:'—'):String(i+1),`<button class="table-team" onclick="openTeam('${uid(t.id)}')">${logo(t.id,t.name)}<span>${esc(t.name)}${t.dynasty?'<small>FOUNDRY</small>':''}</span></button>`,t.cw+'–'+t.cl,t.w+'–'+t.l,t.cw+t.cl?(t.cw/(t.cw+t.cl)).toFixed(3):'—']))}return title(dynasty.name,'Standings')+`<div class="filterbar">${button('Conference','standings','sel')}${button('Top 25','rankings')}${button('Season analysis','analysis')}</div><label for="conferenceSelect">Conference</label><select id="conferenceSelect" onchange="conference=this.value;render()">${confs.map(c=>`<option value="${esc(c)}" ${c===conference?'selected':''}>${esc(c)}</option>`).join('')}</select>${ts.length?(cm.isSunBelt(conference)?['East','West',null].map(d=>{const rows=ts.filter(t=>cm.sunBeltDivision(t.name)===d);return rows.length?section(d?d+' Division':'Unassigned')+standingsTable(rows):''}).join(''):standingsTable(ts)):empty('Conference standings are not available yet.')}<p class="sport-note">Based on recorded results. ${american?'T indicates an unresolved tiebreak; missing tiebreak inputs do not become an overall-record tiebreak. Final championship participants are not certified here.':'Conference win percentage, with the existing main-app ordering. Standings are provisional.'}</p>`}
function rankings(){const latest=model.rankings[0]?.week_number,rs=model.rankings.filter(r=>r.week_number===latest);return title(dynasty.name,'Top 25',latest!=null?'Latest recorded poll · Week '+latest:'No poll recorded')+table(['RANK','TEAM','RECORD'],rs.map(r=>[esc(r.rank),esc(teamData(r.team_id).name),esc(r.wins+'–'+r.losses)]))+(rs.length?'':empty('No rankings have been entered for this season.'))}
function legacy(){return title(dynasty.name,'Legacy')+`<img class="legacy-hero" src="${ASSET}experience/legacy.webp" alt="The Foundry trophy collection">${section('The trophy room','trophies','All honors')}${trophyGrid(model.trophies,3)}${section('Career leaders')}${table(['COACH','WINS','LOSSES'],model.career.slice(0,6).map(c=>[`<button class="textlink" onclick="openCoach('${uid(c.person_id)}')">${esc(c.coach_name)}</button>`,esc(c.wins),esc(c.losses)]))}${section('Every season leaves a story','seasons','Season archive')}${model.seasons.map(s=>row('Season '+s.season_number,s.status,`onclick="loadSeason('${uid(s.season_id)}')"`)).join('')}<p class="sport-note">Honors and career records belong to the selected dynasty.</p>`}
function gamePage(){const g=games().find(g=>g.id===selectedGame);if(!g)return empty('Choose a game from Scores.');const win=g.a>g.h?g.away:g.home;return title(g.week_label||'Week '+g.week_number,g.away+' at '+g.home)+`<div class="game-scorehero"><div>${logo(g.awayId,g.away)}<strong>${esc(g.away)}</strong><b>${esc(g.final?g.a:'—')}</b><small>Away</small></div><div class="game-status">${g.final?'Final'+(g.overtime?' · OT':''):'Upcoming'}</div><div>${logo(g.homeId,g.home)}<strong>${esc(g.home)}</strong><b>${esc(g.final?g.h:'—')}</b><small>Home</small></div></div><div class="info-strip">${esc(g.final?win+' wins by '+Math.abs(g.a-g.h):kickoff(g))}</div>${section(g.final?'Game summary':'Before kickoff')}<p class="article-inline">${esc(g.final?win+' finishes on top, '+Math.max(g.a,g.h)+'–'+Math.min(g.a,g.h)+'.':'The final result has not been recorded.')}</p>${g.event_name?`<p class="muted">${esc(g.event_name)}</p>`:''}${row(g.away,'Team overview, schedule and coach',`onclick="openTeam('${uid(g.awayId)}')"`)}${row(g.home,'Team overview, schedule and coach',`onclick="openTeam('${uid(g.homeId)}')"`)}${row('Week '+g.week_number+' scoreboard','Other results and upcoming games',`onclick="week=${num(g.week_number)};go('scores')"`)}<p class="sport-note">Score entry is available in the main app. This preview is read-only.</p>`}
function analysis(){return title(dynasty.name,'Season analysis','Scoring and records from completed games.')+table(['TEAM','W–L','PPG','ALLOWED'],model.standings.map(s=>[`<button class="textlink" onclick="openTeam('${uid(s.team_id)}')">${esc(s.team_name)}</button>`,esc(s.wins+'–'+s.losses),num(s.games_played)?fmt(s.points_for/s.games_played):'—',num(s.games_played)?fmt(s.points_against/s.games_played):'—']))+section('Go deeper')+row('Conference picture','League records and the current race',`onclick="go('standings')"`)+row('Published Top 25','Latest recorded national poll',`onclick="go('rankings')"`)}
function account(){return title('Your Foundry','Account & league')+`<p class="muted">${esc(session()?.user?.email||'Signed in')}</p>${row('Change league',dynasty?.name||'Choose a league',`onclick="go('leagues')"`)}${row('Change season',season?'Season '+season.season_number:'Choose a season',`onclick="go('seasons')"`)}${row('Refresh league data',updatedAt?'Last loaded '+updatedAt.toLocaleTimeString():'',`onclick="start()"`)}<div class="notice">Live data preview · Read-only</div><button class="secondary" onclick="logout()">Sign out</button>`}
function content(){switch(route){case'home':return home();case'scores':return scores();case'teams':return teams();case'team':return team();case'coach':return coach();case'standings':return standings();case'legacy':return legacy();case'game':return gamePage();case'rankings':return rankings();case'analysis':return analysis();case'career':return title(coachInfo().coach_name,'Career journey')+careerRows(model.stops.filter(s=>s.person_id===selectedCoach));case'rivalries':return title(coachInfo().coach_name,'Head-to-head','Career meetings in this dynasty.')+(rivalryRows().join('')||empty('No recorded games against other Foundry coaches.'));case'trophies':return title(dynasty.name,'The trophy room')+`<label for="honorCoach">Collection</label><select id="honorCoach" onchange="trophyPerson=this.value||null;render()"><option value="">All coaches</option>${model.career.map(c=>`<option value="${uid(c.person_id)}" ${c.person_id===trophyPerson?'selected':''}>${esc(c.coach_name)}</option>`).join('')}</select>`+trophyGrid(honors(trophyPerson));case'stories':return title(dynasty.name,'The Saturday report',latestEdition()?'Published edition · Week '+latestEdition().week_number:'')+newsStories();case'article':{const s=storyItems()[selectedStory];return s?title('The Saturday report',s.headline)+`<img class="hero" src="${ASSET}experience/stadium.webp" alt="Stadium under the lights"><p class="article-inline">${esc(s.fact||'')}</p><p class="article-inline">${esc(s.body||'')}</p>`+(s.game_id&&games().some(g=>g.id===s.game_id)?row('View game','Score and matchup details',`onclick="openGame('${uid(s.game_id)}')"`):''):empty('Choose a published story.')}case'account':return account();case'leagues':return title('Your memberships','Choose your league')+(model.dynasties.map(d=>row(d.name,d.active_season_number?'Season '+d.active_season_number:d.status,`onclick="loadDynasty('${uid(d.dynasty_id)}')"`)).join('')||empty('No league memberships are attached to this account. Join or create a league in the main app.'))+button('Account','account','secondary');case'seasons':return title(dynasty?.name||'League','Season archive')+(model.seasons.map(s=>row('Season '+s.season_number,s.status,`onclick="loadSeason('${uid(s.season_id)}')"`)).join('')||empty('No seasons have been created.'));default:return home()}}
function navSection(){return ['team','teams','coach','career','rivalries'].includes(route)?'teams':['standings','rankings','analysis'].includes(route)?'standings':['legacy','trophies','seasons'].includes(route)?'legacy':['scores','game'].includes(route)?'scores':'home'}
function loginPage(){return `<div class="login-hero"><img src="${ASSET}experience/tunnel.webp" alt="Football stadium tunnel"><div>${title('Welcome to Saturday Foundry','Your next chapter.','The league. The rivalries. Your legacy.')}</div></div><div class="login-body">${title('Live preview','Welcome back','Sign in with your existing Saturday Foundry account.')}<form onsubmit="event.preventDefault();login(this)"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><p id="loginMessage" role="alert" class="error-message"></p><button class="primary" type="submit">Sign in</button></form><p class="sport-note">This preview reads your league data. Score entry and league changes remain in the main app.</p></div>`}
function render(){const signedIn=!!session()?.access_token,ready=signedIn&&!busy&&!loadError,hasSeason=!!season;let body;try{body=busy?`<div class="loading" role="status"><div class="spinner"></div>${title('Saturday Foundry','Loading your league…','Pulling the latest schedule, coaches and history.')}</div>`:loadError?title('Unable to load','Let’s try that again.',loadError)+`<button class="primary" onclick="start()">Retry</button>${signedIn?'<button class="secondary" onclick="logout()">Sign out</button>':''}`:!signedIn?loginPage():content()}catch(e){body=title('Preview error','This screen could not load.',e.message)+button('Home','home')}
 $('app').innerHTML=`<div class="mast"><span class="shield">SF</span><span class="word">SATURDAY FOUNDRY<small>${esc(signedIn&&dynasty?dynasty.name:'YOUR COACHING STORY')}</small></span><div class="mast-actions">${signedIn&&!busy?`<button class="avatar" onclick="go('account')" aria-label="Account and league menu">${esc(initials(session()?.user?.user_metadata?.display_name||session()?.user?.email||'SF'))}</button>`:''}</div></div><div class="viewport" id="screenViewport">${ready&&!['home','scores','teams','standings','legacy','leagues'].includes(route)?`<div class="crumb"><button onclick="back()">${ico('back')} Back</button><span>${esc(dynasty?.name||'Account')}</span></div>`:''}<div class="content ${!signedIn&&!busy?'auth-content':''}">${ready&&model.warnings.length?`<div class="notice" role="status">${esc(model.warnings.join(' '))} <button class="textlink" onclick="start()">Retry</button></div>`:''}${body}</div><div class="footer">Saturday Foundry · Preview 05 · Live data · Read-only</div></div>${ready&&hasSeason?`<nav class="bottomnav" aria-label="Main navigation">${[['Home','home'],['Scores','scores'],['Teams','teams'],['Standings','standings'],['Legacy','legacy']].map(([n,r])=>`<button class="${navSection()===r?'on':''}" ${navSection()===r?'aria-current="page"':''} onclick="go('${r}')">${ico(r)}<span>${n}</span></button>`).join('')}</nav>`:''}`;
 $('status').textContent=busy?'Connecting…':signedIn&&updatedAt&&!loadError?'LIVE DATA · READ-ONLY':'PREVIEW 05 · LIVE DATA';
 if(route==='scores')document.querySelector('.weekstrip .selected')?.scrollIntoView({block:'nearest',inline:'center'});
}
$('detailSheet').addEventListener('click',e=>{if(e.target===$('detailSheet'))closeSheet()});
start();
</script></body></html>
