name: Apply site-wide logo surface sizing preview

on:
  push:
    branches: [logo-surface-sizing-preview]
    paths:
      - '.github/workflows/apply-logo-surface-sizing-preview.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append surface sizing authority
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='sf-logo-surface-sizing-v1'
          patch="\n<style id=\"sf-logo-surface-sizing-v1\">\n/* Preview: site-wide team logo sizing authority.\n   No percentages. 48px is the safe fallback; known surfaces override it. */\n\n/* Safe default for any classified team logo that slips through a component-specific rule. */\n.sf-team-logo-plate-v5>img.sf-team-identity-logo-v5,\nimg[data-sf-team-control],\nimg.sf-logo-system-v2{\n  width:48px!important;\n  height:48px!important;\n  min-width:48px!important;\n  max-width:48px!important;\n  min-height:48px!important;\n  max-height:48px!important;\n  object-fit:contain!important;\n  object-position:50% 50%!important;\n  flex:0 0 48px!important;\n}\n\n/* OVERVIEW — GOTW */\n#overview #gotw .team-side>.sf-team-logo-plate-v5>img,\n#overview #gotw img.team-logo{\n  width:64px!important;\n  height:64px!important;\n  min-width:64px!important;\n  max-width:64px!important;\n  min-height:64px!important;\n  max-height:64px!important;\n  flex:0 0 64px!important;\n}\n@media(max-width:700px){\n  #overview #gotw .team-side>.sf-team-logo-plate-v5>img,\n  #overview #gotw img.team-logo{\n    width:60px!important;\n    height:60px!important;\n    min-width:60px!important;\n    max-width:60px!important;\n    min-height:60px!important;\n    max-height:60px!important;\n    flex-basis:60px!important;\n  }\n}\n\n/* SCHEDULE — season hero + matchup cards + archived/legacy rows */\n#schedule img.sf-team-season-logo{\n  width:62px!important;\n  height:62px!important;\n  min-width:62px!important;\n  max-width:62px!important;\n  min-height:62px!important;\n  max-height:62px!important;\n  flex:0 0 62px!important;\n}\n#schedule .sf-match-team>.sf-team-logo-plate-v5>img,\n#schedule .sf-match-team img.sf-match-logo{\n  width:54px!important;\n  height:54px!important;\n  min-width:54px!important;\n  max-width:54px!important;\n  min-height:54px!important;\n  max-height:54px!important;\n  flex:0 0 54px!important;\n}\n#schedule img.v23-team-logo{\n  width:38px!important;\n  height:38px!important;\n  min-width:38px!important;\n  max-width:38px!important;\n  min-height:38px!important;\n  max-height:38px!important;\n  flex:0 0 38px!important;\n}\n#schedule img.v23-archive-logo{\n  width:22px!important;\n  height:22px!important;\n  min-width:22px!important;\n  max-width:22px!important;\n  min-height:22px!important;\n  max-height:22px!important;\n  flex:0 0 22px!important;\n}\n@media(max-width:700px){\n  #schedule img.sf-team-season-logo{\n    width:50px!important;\n    height:50px!important;\n    min-width:50px!important;\n    max-width:50px!important;\n    min-height:50px!important;\n    max-height:50px!important;\n    flex-basis:50px!important;\n  }\n  #schedule .sf-match-team>.sf-team-logo-plate-v5>img,\n  #schedule .sf-match-team img.sf-match-logo{\n    width:38px!important;\n    height:38px!important;\n    min-width:38px!important;\n    max-width:38px!important;\n    min-height:38px!important;\n    max-height:38px!important;\n    flex-basis:38px!important;\n  }\n  #schedule img.v23-team-logo{\n    width:32px!important;\n    height:32px!important;\n    min-width:32px!important;\n    max-width:32px!important;\n    min-height:32px!important;\n    max-height:32px!important;\n    flex-basis:32px!important;\n  }\n  #schedule img.v23-archive-logo{\n    width:18px!important;\n    height:18px!important;\n    min-width:18px!important;\n    max-width:18px!important;\n    min-height:18px!important;\n    max-height:18px!important;\n    flex-basis:18px!important;\n  }\n}\n\n/* TOP 25 */\n.top25-row .sf-team-logo-plate-v5>img,\n.top25-row img{\n  width:26px!important;\n  height:26px!important;\n  min-width:26px!important;\n  max-width:26px!important;\n  min-height:26px!important;\n  max-height:26px!important;\n  flex:0 0 26px!important;\n}\n@media(max-width:640px){\n  .top25-row .sf-team-logo-plate-v5>img,\n  .top25-row img{\n    width:23px!important;\n    height:23px!important;\n    min-width:23px!important;\n    max-width:23px!important;\n    min-height:23px!important;\n    max-height:23px!important;\n    flex-basis:23px!important;\n  }\n}\n\n/* INTELLIGENCE / ANALYTICS metric cards */\n.metric-title .sf-team-logo-plate-v5>img,\n.metric-title img.team-logo,\n.metric-title img[data-sf-team-control]{\n  width:36px!important;\n  height:36px!important;\n  min-width:36px!important;\n  max-width:36px!important;\n  min-height:36px!important;\n  max-height:36px!important;\n  flex:0 0 36px!important;\n}\n\n/* TROPHY ROOM / PROGRAM LEGACY CARDS */\n.legacy-program-logo .sf-team-logo-plate-v5>img,\n.legacy-program-logo img{\n  width:48px!important;\n  height:48px!important;\n  min-width:48px!important;\n  max-width:48px!important;\n  min-height:48px!important;\n  max-height:48px!important;\n  flex:0 0 48px!important;\n}\n.trophy-coach-logo .sf-team-logo-plate-v5>img,\n.trophy-coach-logo img{\n  width:43px!important;\n  height:43px!important;\n  min-width:43px!important;\n  max-width:43px!important;\n  min-height:43px!important;\n  max-height:43px!important;\n  flex:0 0 43px!important;\n}\n\n/* COACH CHRONICLES */\n.story-coach-logo .sf-team-logo-plate-v5>img,\n.story-coach-logo img{\n  width:42px!important;\n  height:42px!important;\n  min-width:42px!important;\n  max-width:42px!important;\n  min-height:42px!important;\n  max-height:42px!important;\n  flex:0 0 42px!important;\n}\n\n/* DYNASTY CHOOSER + DYNASTY HUB */\n.dynasty-choice-logo .sf-team-logo-plate-v5>img,\n.dynasty-choice-logo img{\n  width:48px!important;\n  height:48px!important;\n  min-width:48px!important;\n  max-width:48px!important;\n  min-height:48px!important;\n  max-height:48px!important;\n  flex:0 0 48px!important;\n}\n.dynasty-hub-league-logo .sf-team-logo-plate-v5>img,\n.dynasty-hub-league-logo img{\n  width:38px!important;\n  height:38px!important;\n  min-width:38px!important;\n  max-width:38px!important;\n  min-height:38px!important;\n  max-height:38px!important;\n  flex:0 0 38px!important;\n}\n@media(max-width:760px){\n  .dynasty-choice-logo .sf-team-logo-plate-v5>img,\n  .dynasty-choice-logo img{\n    width:43px!important;\n    height:43px!important;\n    min-width:43px!important;\n    max-width:43px!important;\n    min-height:43px!important;\n    max-height:43px!important;\n    flex-basis:43px!important;\n  }\n}\n\n/* TEAM SELECTION */\n#teamGrid .v25-choice-logo-img,\n#teamGrid .sf-team-logo-plate-v5>img{\n  width:100px!important;\n  height:100px!important;\n  min-width:100px!important;\n  max-width:100px!important;\n  min-height:100px!important;\n  max-height:100px!important;\n  flex:0 0 100px!important;\n}\n#teamSelectionDock .v25-dock-logo img,\n#teamSelectionDock .sf-team-logo-plate-v5>img{\n  width:46px!important;\n  height:46px!important;\n  min-width:46px!important;\n  max-width:46px!important;\n  min-height:46px!important;\n  max-height:46px!important;\n  flex:0 0 46px!important;\n}\n@media(max-width:620px){\n  #teamGrid .v25-choice-logo-img,\n  #teamGrid .sf-team-logo-plate-v5>img{\n    width:66px!important;\n    height:66px!important;\n    min-width:66px!important;\n    max-width:66px!important;\n    min-height:66px!important;\n    max-height:66px!important;\n    flex-basis:66px!important;\n  }\n  #teamSelectionDock .v25-dock-logo img,\n  #teamSelectionDock .sf-team-logo-plate-v5>img{\n    width:38px!important;\n    height:38px!important;\n    min-width:38px!important;\n    max-width:38px!important;\n    min-height:38px!important;\n    max-height:38px!important;\n    flex-basis:38px!important;\n  }\n}\n\n/* Older GOTW2 fallback if that renderer is surfaced anywhere. */\n#overview .gotw2-logo,\n#overview .gotw2-team .sf-team-logo-plate-v5>img{\n  width:44px!important;\n  height:44px!important;\n  min-width:44px!important;\n  max-width:44px!important;\n  min-height:44px!important;\n  max-height:44px!important;\n  flex:0 0 44px!important;\n}\n@media(min-width:1401px){\n  #overview .gotw2-logo,\n  #overview .gotw2-team .sf-team-logo-plate-v5>img{\n    width:62px!important;\n    height:62px!important;\n    min-width:62px!important;\n    max-width:62px!important;\n    min-height:62px!important;\n    max-height:62px!important;\n    flex-basis:62px!important;\n  }\n}\n</style>\n<meta name=\"saturday-foundry-logo-sizing-preview\" content=\"v1-surface-explicit-sizes\">\n"
          if marker not in s:
              s=s.rstrip()+"\n"+patch+"\n"
          p.write_text(s)
          PY
      - name: Validate
        run: |
          grep -q 'sf-logo-surface-sizing-v1' index.html
          grep -q 'v1-surface-explicit-sizes' index.html
      - name: Commit
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Size team logos by surface'
          git push origin logo-surface-sizing-preview
