name: Apply week archive redesign preview

on:
  push:
    branches: [week-archive-redesign-preview]
    paths:
      - '.github/workflows/apply-week-archive-redesign-preview.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append Week-by-Week scoreboard styling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='sf-week-archive-redesign-preview-v1'
          css="\n<style id=\"sf-week-archive-redesign-preview-v1\">\n/* Preview-only: Week-by-Week archive as compact scoreboard cards.\n   Data/render logic unchanged; this only re-establishes a clean visual hierarchy. */\n\n#schedule .v21-season-archive{\n  margin-top:18px!important;\n  padding:18px!important;\n  border:1px solid rgba(244,197,66,.18)!important;\n  border-radius:18px!important;\n  background:\n    radial-gradient(circle at 100% 0%,rgba(244,197,66,.05),transparent 30%),\n    linear-gradient(180deg,rgba(4,14,19,.92),rgba(2,10,14,.96))!important;\n}\n\n#schedule .v21-archive-head{\n  margin-bottom:14px!important;\n}\n#schedule .v21-archive-head h3{\n  margin:3px 0 0!important;\n  font-size:clamp(26px,3.2vw,38px)!important;\n  line-height:1!important;\n}\n#schedule .v21-archive-note{\n  margin-top:6px!important;\n  font-size:11px!important;\n  color:#8f9ca4!important;\n}\n\n#schedule .v21-week-groups{\n  display:grid!important;\n  gap:10px!important;\n}\n\n#schedule .v21-week-group{\n  margin:0!important;\n  border:1px solid rgba(148,163,184,.13)!important;\n  border-radius:14px!important;\n  overflow:hidden!important;\n  background:linear-gradient(180deg,rgba(5,17,23,.92),rgba(3,12,17,.94))!important;\n}\n\n#schedule .v21-week-group summary{\n  min-height:52px!important;\n  padding:11px 13px!important;\n  border:0!important;\n  background:rgba(255,255,255,.018)!important;\n}\n#schedule .v21-week-group summary>div:first-child{\n  gap:9px!important;\n}\n#schedule .v21-week-group summary strong{\n  font-family:'Barlow Condensed',Teko,sans-serif!important;\n  font-size:24px!important;\n  line-height:1!important;\n  letter-spacing:.02em!important;\n}\n#schedule .v21-week-group summary span{\n  font-size:10px!important;\n  color:#83949e!important;\n}\n#schedule .v21-week-group summary>div:last-child{\n  padding:5px 8px!important;\n  border:1px solid rgba(244,197,66,.24)!important;\n  border-radius:999px!important;\n  color:#f4c542!important;\n  background:rgba(244,197,66,.045)!important;\n  font-size:9px!important;\n  font-weight:900!important;\n  letter-spacing:.08em!important;\n  line-height:1!important;\n}\n\n#schedule .v21-week-list{\n  display:grid!important;\n  gap:8px!important;\n  padding:0 10px 10px!important;\n}\n\n#schedule .v21-archive-game{\n  display:grid!important;\n  grid-template-columns:minmax(0,1fr) auto!important;\n  grid-template-areas:\n    \"match result\"\n    \"coach broadcast\"!important;\n  column-gap:12px!important;\n  row-gap:7px!important;\n  align-items:center!important;\n  min-width:0!important;\n  padding:11px 12px!important;\n  border:1px solid rgba(148,163,184,.10)!important;\n  border-radius:11px!important;\n  background:rgba(2,11,16,.62)!important;\n}\n\n#schedule .v21-archive-coach{\n  grid-area:coach!important;\n  min-width:0!important;\n  font-size:9px!important;\n  line-height:1.2!important;\n  color:#71848f!important;\n  white-space:nowrap!important;\n  overflow:hidden!important;\n  text-overflow:ellipsis!important;\n}\n\n#schedule .v21-archive-match,\n#schedule .v21-archive-match.v23-archive-match{\n  grid-area:match!important;\n  display:grid!important;\n  grid-template-columns:26px minmax(0,1fr) 26px!important;\n  gap:8px!important;\n  align-items:center!important;\n  min-width:0!important;\n  width:100%!important;\n  color:#f5f7f8!important;\n  font-size:13px!important;\n  font-weight:800!important;\n  line-height:1.15!important;\n}\n\n#schedule .v21-archive-match>span:not(.sf-team-logo-plate-v5):not(.v23-archive-logo-placeholder){\n  min-width:0!important;\n  white-space:normal!important;\n  overflow-wrap:normal!important;\n  word-break:normal!important;\n}\n\n#schedule .v21-archive-match .conf-game-badge{\n  display:inline-flex!important;\n  align-items:center!important;\n  margin-left:5px!important;\n  padding:2px 5px!important;\n  vertical-align:1px!important;\n  font-size:8px!important;\n  line-height:1!important;\n}\n\n#schedule .v21-archive-match img.v23-archive-logo,\n#schedule .v21-archive-match .sf-team-logo-plate-v5>img,\n#schedule .v21-archive-match .v23-archive-logo-placeholder{\n  width:24px!important;\n  height:24px!important;\n  min-width:24px!important;\n  max-width:24px!important;\n  min-height:24px!important;\n  max-height:24px!important;\n  margin:0!important;\n  padding:0!important;\n  justify-self:center!important;\n  align-self:center!important;\n  object-fit:contain!important;\n  object-position:50% 50%!important;\n  background:transparent!important;\n  border:0!important;\n  box-shadow:none!important;\n}\n\n#schedule .v21-archive-result{\n  grid-area:result!important;\n  display:grid!important;\n  justify-items:end!important;\n  align-content:center!important;\n  gap:5px!important;\n  min-width:max-content!important;\n  font-size:14px!important;\n  font-weight:900!important;\n  line-height:1!important;\n  white-space:nowrap!important;\n}\n#schedule .v21-archive-result.pos{color:#7ce3be!important}\n#schedule .v21-archive-result.neg{color:#ff8585!important}\n\n#schedule .v21-archive-result [data-edit-game],\n#schedule .v21-archive-game [data-edit-game]{\n  min-height:32px!important;\n  width:auto!important;\n  margin:0!important;\n  padding:6px 9px!important;\n  border:1px solid rgba(244,197,66,.24)!important;\n  border-radius:8px!important;\n  background:rgba(244,197,66,.055)!important;\n  color:#e8c35b!important;\n  font-size:9px!important;\n  font-weight:900!important;\n  line-height:1!important;\n  white-space:nowrap!important;\n}\n\n#schedule .v21-archive-broadcast{\n  grid-area:broadcast!important;\n  justify-self:end!important;\n  min-width:0!important;\n  color:#7b8c95!important;\n  text-align:right!important;\n}\n\n#schedule .v21-archive-game.bye{\n  opacity:.7!important;\n}\n\n@media(max-width:700px){\n  #schedule .v21-season-archive{\n    padding:13px!important;\n    border-radius:15px!important;\n  }\n\n  #schedule .v21-archive-head h3{\n    max-width:290px!important;\n    font-size:29px!important;\n    line-height:1.02!important;\n  }\n\n  #schedule .v21-week-groups{\n    gap:9px!important;\n  }\n\n  #schedule .v21-week-group summary{\n    min-height:50px!important;\n    padding:10px 11px!important;\n  }\n  #schedule .v21-week-group summary strong{\n    font-size:23px!important;\n  }\n\n  #schedule .v21-week-list{\n    padding:0 8px 8px!important;\n  }\n\n  #schedule .v21-archive-game{\n    grid-template-columns:minmax(0,1fr) auto!important;\n    grid-template-areas:\n      \"match result\"\n      \"broadcast broadcast\"!important;\n    column-gap:9px!important;\n    row-gap:8px!important;\n    padding:11px 10px!important;\n    border-radius:10px!important;\n  }\n\n  #schedule .v21-archive-coach{\n    display:none!important;\n  }\n\n  #schedule .v21-archive-match,\n  #schedule .v21-archive-match.v23-archive-match{\n    grid-template-columns:28px minmax(0,1fr) 28px!important;\n    gap:7px!important;\n    font-size:13px!important;\n    line-height:1.18!important;\n  }\n\n  #schedule .v21-archive-match img.v23-archive-logo,\n  #schedule .v21-archive-match .sf-team-logo-plate-v5>img,\n  #schedule .v21-archive-match .v23-archive-logo-placeholder{\n    width:26px!important;\n    height:26px!important;\n    min-width:26px!important;\n    max-width:26px!important;\n    min-height:26px!important;\n    max-height:26px!important;\n  }\n\n  #schedule .v21-archive-match .conf-game-badge{\n    display:block!important;\n    width:max-content!important;\n    max-width:100%!important;\n    margin:5px 0 0!important;\n  }\n\n  #schedule .v21-archive-result{\n    font-size:14px!important;\n    gap:6px!important;\n  }\n\n  #schedule .v21-archive-broadcast{\n    justify-self:stretch!important;\n    display:flex!important;\n    justify-content:flex-end!important;\n    gap:6px!important;\n    min-height:0!important;\n  }\n\n  #schedule .v21-archive-broadcast:empty{\n    display:none!important;\n  }\n}\n</style>\n<meta name=\"saturday-foundry-week-archive-preview\" content=\"v1-mobile-scoreboard\">\n"
          if marker not in s:
              s=s.rstrip()+"\n"+css+"\n"
          p.write_text(s)
          PY
      - name: Validate
        run: |
          grep -q 'sf-week-archive-redesign-preview-v1' index.html
          grep -q 'v1-mobile-scoreboard' index.html
      - name: Commit
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Redesign Week-by-Week archive scoreboard'
          git push origin week-archive-redesign-preview
