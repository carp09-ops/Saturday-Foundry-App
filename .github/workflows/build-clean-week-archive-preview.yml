name: Build clean Week archive preview
on:
  push:
    branches: [week-archive-clean-preview]
    paths:
      - '.github/workflows/build-clean-week-archive-preview.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append archive styling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='sf-week-archive-clean-v2'
          css="<style id=\"sf-week-archive-clean-v2\">\n#schedule .v21-season-archive{margin-top:18px!important;padding:18px!important;border:1px solid rgba(244,197,66,.18)!important;border-radius:18px!important;background:radial-gradient(circle at 100% 0%,rgba(244,197,66,.05),transparent 30%),linear-gradient(180deg,rgba(4,14,19,.92),rgba(2,10,14,.96))!important}\n#schedule .v21-week-groups{display:grid!important;gap:10px!important}\n#schedule .v21-week-group{margin:0!important;border:1px solid rgba(148,163,184,.13)!important;border-radius:14px!important;overflow:hidden!important;background:linear-gradient(180deg,rgba(5,17,23,.92),rgba(3,11,15,.94))!important}\n#schedule .v21-week-group summary{min-height:52px!important;padding:11px 13px!important;border:0!important;background:rgba(255,255,255,.018)!important}\n#schedule .v21-week-group summary strong{font-family:'Barlow Condensed',Teko,sans-serif!important;font-size:24px!important;line-height:1!important}\n#schedule .v21-week-list{display:grid!important;gap:8px!important;padding:0 10px 10px!important}\n#schedule .v21-archive-game{display:grid!important;grid-template-columns:minmax(0,1fr) auto!important;grid-template-areas:\"match result\" \"coach broadcast\"!important;column-gap:12px!important;row-gap:7px!important;align-items:center!important;min-width:0!important;padding:11px 12px!important;border:1px solid rgba(148,163,184,.10)!important;border-radius:11px!important;background:rgba(2,11,16,.62)!important}\n#schedule .v21-archive-coach{grid-area:coach!important;font-size:9px!important;color:#71848f!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}\n#schedule .v21-archive-match,#schedule .v21-archive-match.v23-archive-match{grid-area:match!important;display:grid!important;grid-template-columns:36px minmax(0,1fr) 36px!important;gap:10px!important;align-items:center!important;min-width:0!important;width:100%!important;color:#f5f7f8!important;font-size:13px!important;font-weight:800!important;line-height:1.15!important}\n#schedule .v21-archive-match img.v23-archive-logo,#schedule .v21-archive-match .sf-team-logo-plate-v5>img,#schedule .v21-archive-match .v23-archive-logo-placeholder{width:34px!important;height:34px!important;min-width:34px!important;max-width:34px!important;min-height:34px!important;max-height:34px!important;margin:0!important;padding:0!important;justify-self:center!important;align-self:center!important;object-fit:contain!important;object-position:50% 50%!important;background:transparent!important;border:0!important;box-shadow:none!important}\n#schedule .v21-archive-result{grid-area:result!important;display:grid!important;justify-items:end!important;gap:5px!important;min-width:max-content!important;font-size:14px!important;font-weight:900!important;line-height:1!important;white-space:nowrap!important}\n#schedule .v21-archive-result [data-edit-game],#schedule .v21-archive-game [data-edit-game]{min-height:32px!important;width:auto!important;margin:0!important;padding:6px 9px!important;border:1px solid rgba(244,197,66,.24)!important;border-radius:8px!important;background:rgba(244,197,66,.055)!important;color:#e8c35b!important;font-size:9px!important;font-weight:900!important;line-height:1!important;white-space:nowrap!important}\n#schedule .v21-archive-broadcast{grid-area:broadcast!important;justify-self:end!important;color:#7b8c95!important;text-align:right!important}\n@media(max-width:700px){\n#schedule .v21-season-archive{padding:13px!important;border-radius:15px!important}\n#schedule .v21-week-groups{gap:9px!important}\n#schedule .v21-week-group summary{min-height:50px!important;padding:10px 11px!important}\n#schedule .v21-week-group summary strong{font-size:23px!important}\n#schedule .v21-week-list{padding:0 8px 8px!important}\n#schedule .v21-archive-game{grid-template-columns:minmax(0,1fr) auto!important;grid-template-areas:\"match result\" \"broadcast broadcast\"!important;column-gap:9px!important;row-gap:8px!important;padding:11px 10px!important}\n#schedule .v21-archive-coach{display:none!important}\n#schedule .v21-archive-match,#schedule .v21-archive-match.v23-archive-match{grid-template-columns:42px minmax(0,1fr) 42px!important;gap:9px!important;font-size:13px!important;line-height:1.18!important}\n#schedule .v21-archive-match img.v23-archive-logo,#schedule .v21-archive-match .sf-team-logo-plate-v5>img,#schedule .v21-archive-match .v23-archive-logo-placeholder{width:40px!important;height:40px!important;min-width:40px!important;max-width:40px!important;min-height:40px!important;max-height:40px!important}\n#schedule .v21-archive-broadcast{justify-self:stretch!important;display:flex!important;justify-content:flex-end!important;gap:6px!important}\n}\n</style>\n<meta name=\"saturday-foundry-week-archive-preview\" content=\"clean-v2\">"
          if marker not in s:
              s=s.rstrip()+"\n"+css+"\n"
          p.write_text(s)
          PY
      - name: Commit
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Build clean Week-by-Week preview'
          git push origin week-archive-clean-preview
