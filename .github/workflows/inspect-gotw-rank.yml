name: Inspect GOTW rank source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-gotw-rank.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect ranking/GOTW code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text()
          terms = [
              'function gotwVerifiedRank',
              'function scheduleDisplayRanks',
              'function rankingForTeamWeek',
              'function renderGotw',
              'function renderGOTW',
              'selectGotwCarousel',
              'gotwVerifiedRank(',
              'scheduleDisplayRanks('
          ]
          for term in terms:
              start=0
              n=0
              while True:
                  i=s.find(term,start)
                  if i<0 or n>=12: break
                  print(f"\n===== {term} @ {i} =====")
                  print(s[max(0,i-1800):min(len(s),i+4200)])
                  start=i+len(term)
                  n+=1
          PY
