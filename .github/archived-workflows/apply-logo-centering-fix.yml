name: Apply logo centering fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-logo-centering-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply centering CSS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          marker = 'sf-logo-centering-v1'
          if marker in s:
              print('Centering fix already present.')
          else:
              css = """
          <style id="sf-logo-centering-v1">
          /* Phone Schedule + GOTW logo centering normalization */
          @media (max-width:700px){
            #schedule .sf-match-team > .sf-team-logo-plate-v5,
            #schedule .sf-match-team > .sf-match-logo,
            #schedule .sf-match-team > .sf-match-logo-fallback{
              justify-self:center!important;
              align-self:center!important;
              margin-left:auto!important;
              margin-right:auto!important;
            }
            #schedule .sf-team-logo-plate-v5 img,
            #schedule .sf-match-logo img{
              display:block!important;
              margin:0 auto!important;
              object-position:center center!important;
            }
          }
          #overview #gotw .gotw-matchup .team-logo,
          #overview #gotw .gotw-matchup .team-fallback{
            justify-self:center!important;
            align-self:center!important;
            margin-left:auto!important;
            margin-right:auto!important;
            object-position:center center!important;
          }
          </style>
          <meta name="saturday-foundry-logo-centering" content="v1">
          """
              css = '\n'.join(line[10:] if line.startswith('          ') else line for line in css.splitlines())
              if '</head>' not in s:
                  raise SystemExit('No </head> found')
              s = s.replace('</head>', css + '\n</head>', 1)
              p.write_text(s)
          PY

      - name: Validate patch
        run: |
          grep -q 'sf-logo-centering-v1' index.html
          grep -q 'saturday-foundry-logo-centering' index.html
          git diff --check

      - name: Commit centered logos
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Center Schedule and GOTW team logos'
          git push origin main
