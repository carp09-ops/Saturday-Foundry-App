name: Fix GOTW latest ranking source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-gotw-rank.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch GOTW ranking resolution
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          pattern=r'function gotwVerifiedRank\(teamId,name,week,fallback\)\{.*?\n\}'
          replacement='function gotwVerifiedRank(teamId,name,week,fallback){\n const key=teamKey(name);\n const resolvedWeek=Number(week??selectedWeek??currentWeek());\n const row=(state.rankings||[])\n   .filter(r=>Number(r.week_number)<=resolvedWeek&&((teamId&&String(r.team_id)===String(teamId))||teamKey(r.team?.name)===key))\n   .sort((a,b)=>Number(b.week_number)-Number(a.week_number))[0];\n if(row)return Number(row.rank)||fallback||null;\n // Use the latest official poll available through this game week; participant rank is fallback only.\n return fallback??null;\n}'
          s,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit(f'Expected one patched gotwVerifiedRank function; found {n}')
          old_marker='<meta name="saturday-foundry-gotw-ranking-source" content="weekly-poll-by-game-week-v1">'
          new_marker='<meta name="saturday-foundry-gotw-ranking-source" content="latest-official-poll-through-game-week-v2">'
          if old_marker in s:
              s=s.replace(old_marker,new_marker,1)
          elif new_marker not in s:
              if '</head>' not in s:
                  raise SystemExit('No </head> found.')
              s=s.replace('</head>',new_marker+'\n</head>',1)
          p.write_text(s)
          PY

      - name: Validate patch
        run: |
          grep -q 'latest-official-poll-through-game-week-v2' index.html
          grep -q 'Number(r.week_number)<=resolvedWeek' index.html
          grep -q 'sort((a,b)=>Number(b.week_number)-Number(a.week_number))' index.html
          grep -q 'gotwVerifiedRank(g.team_id,g.team_name,g.week_number,rawRanks.team)' index.html
          git diff --check

      - name: Commit GOTW ranking fix
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Use latest official Top 25 in GOTW'
          git push origin main
