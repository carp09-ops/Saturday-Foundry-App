name: Remove coach card school name preview

on:
  push:
    branches: [logo-surface-sizing-preview]
    paths:
      - '.github/workflows/remove-coach-card-school-name-preview.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove school name from collectible coach card
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='''<div class="coach-card-program">${program.logo?`<img src="${esc(program.logo)}" alt="">`:''}<strong>${esc(program.team)}</strong></div>'''
          new='''<div class="coach-card-program">${program.logo?`<img src="${esc(program.logo)}" alt="${esc(program.team)} logo">`:''}</div>'''
          if old not in s:
              raise SystemExit('coach-card program markup not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert '<strong>${esc(program.team)}</strong>' not in s
          assert 'class="coach-card-program"' in s
          PY
      - name: Commit
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Remove school name from coach trading card'
          git push origin logo-surface-sizing-preview