name: Apply Record Book Coach Cards

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-record-book-coach-cards.yml'
      - '.github/scripts/apply_record_cards.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Record Book upgrade
        id: patch
        continue-on-error: true
        run: |
          python3 - <<'PY' > patch-debug.txt 2>&1
          import gzip, zlib, runpy
          def decompress_without_trailer_check(data):
              return zlib.decompress(data[10:-8], -zlib.MAX_WBITS)
          gzip.decompress = decompress_without_trailer_check
          runpy.run_path('.github/scripts/apply_record_cards.py', run_name='__main__')
          PY

      - name: Save patch diagnostics on failure
        if: steps.patch.outcome == 'failure'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add patch-debug.txt
          git commit -m 'Capture Record Book patch diagnostics'
          git push origin main
          cat patch-debug.txt
          exit 1

      - name: Validate upgrade
        if: steps.patch.outcome == 'success'
        run: |
          grep -q 'record-book-trading-cards-v1' index.html
          grep -q 'COACH_CARD_PORTRAITS' index.html
          grep -q 'FOUNDRY COACH COLLECTION' index.html
          test -f assets/coach-cards/corey-coach-card.webp
          test -f assets/coach-cards/jared-coach-card.webp
          test -f assets/coach-cards/saif-coach-card.webp
          test -f assets/coach-cards/pete-coach-card.webp
          git diff --check

      - name: Commit patched index
        if: steps.patch.outcome == 'success'
        run: |
          if git diff --quiet -- index.html; then
            echo 'index.html already contains the coach card upgrade.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Implement Record Book coach trading cards'
          git push origin main
